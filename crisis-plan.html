  <script>
    // LocalStorage Shim for window.storage to persist state in standard browsers
    if (!window.storage) {
      window.storage = {
        get: async (key) => {
          try {
            const value = localStorage.getItem(key);
            return value ? { value } : null;
          } catch (e) {
            console.error("Failed to read from localStorage", e);
            return null;
          }
        },
        set: async (key, value) => {
          try {
            localStorage.setItem(key, value);
          } catch (e) {
            console.error("Failed to write to localStorage", e);
          }
        }
      };
    }

              { label: "Other", detail: "text", detailLabel: "What else" },
            ] },
          { id: "doc_where", label: "Where the family keeps their copy of this plan", type: "text", req: true, family: true,
            hint: "On the fridge. A photo on the phone. In the diaper bag. With the child-care provider. A plan in a drawer is a plan nobody reads in the moment." },
        ],
      },

      // ─── 8. Review, signatures, and the family's copy ───
      {
        id: "review",
        num: "8",
        title: "Review, signatures, and the family's copy",
        blurb: "The three CFCR page attestations, proof the plan was read with the caregiver in plain language, who has a copy, signatures, and what triggers the next review.",
        fields: [
          { id: "note_pages", type: "note",
            title: "The three \"Did you update this page?\" questions.",
            body: "CFCR asks it once per page. This app's sections map onto those pages: page 1 is Sections 1 and 2, page 2 is Sections 3, 6 and 7, page 3 is Sections 4 and 5. Answer all three here and the record shows the plan was reviewed, not just stored." },
          { id: "cfcr_page1", label: "CFCR page 1 — did you update this page?", type: "radio", req: true, group: "Page attestations",
            hint: "Address, living situation, communication, language, legally responsible person, insurance, diagnoses, medical and dental, medications, allergies, other providers. App Sections 1 and 2.",
            options: YN },
          { id: "cfcr_page2", label: "CFCR page 2 — did you update this page?", type: "radio", req: true,
            hint: "Supports for the individual, crisis follow-up planning, additional planning documents. App Sections 3, 6 and 7.",
            options: YN },
          { id: "cfcr_page3", label: "CFCR page 3 — did you update this page?", type: "radio", req: true,
            hint: "General characteristics and preferences, ways others can help. App Sections 4 and 5.",
            options: YN },
          { id: "reviewed_with", label: "Was this plan read through with the caregiver in plain language?", type: "radio", req: true, group: "With the family",
            hint: "Not handed over — read together, out loud, in the order they would use it.",
            options: [
              { label: "Yes" },
              { label: "Yes — with an interpreter" },
              { label: "Partly — finish at the next visit", detail: "date", detailLabel: "When it will be finished" },
              { label: "Not yet — schedule it", detail: "date", detailLabel: "When" },
            ] },
          { id: "copy_given", label: "Does the legally responsible person have a copy?", type: "radio", req: true,
            options: [
              { label: "Yes — printed" },
              { label: "Yes — photo or digital copy on their phone" },
              { label: "Yes — printed and on their phone" },
              { label: "Not yet", detail: "date", detailLabel: "When they will get one" },
            ] },
          { id: "copy_others", label: "Copies shared with others, with consent", type: "check",
            options: [
              { label: "Child care or preschool" },
              { label: "Pediatrician or medical home" },
              { label: "DSS social worker" },
              { label: "The other parent or caregiver household" },
              { label: "A named support person" },
              { label: "LME-MCO care manager" },
              { label: "None yet" },
              { label: "Other", detail: "text", detailLabel: "Who else" },
            ] },
          { id: "review_trigger", label: "This plan gets reviewed again if any of these happen", type: "check", req: true,
            options: [
              { label: "A crisis event" },
              { label: "A placement change" },
              { label: "A medication change" },
              { label: "A new diagnosis" },
              { label: "The family moves" },
              { label: "Child care or school changes" },
              { label: "A change in who is in the home" },
              { label: "A change in custody or a court order" },
              { label: "The treatment plan review" },
              { label: "Other", detail: "text", detailLabel: "What else" },
            ] },
          { id: "sig_caregiver", label: "Signature — caregiver / legally responsible person", type: "text", req: true, group: "Signatures" },
          { id: "sig_caregiver_date", label: "Date", type: "date", req: true },
          { id: "sig_clinician", label: "Signature — clinician", type: "text", req: true },
          { id: "sig_clinician_date", label: "Date", type: "date", req: true },
          { id: "sig_frp", label: "Signature — Family Resource Partner", type: "text" },
          { id: "sig_frp_date", label: "Date", type: "date" },
          { id: "sig_supervisor", label: "Signature — supervisor", type: "text" },
          { id: "sig_supervisor_date", label: "Date", type: "date" },
        ],
      },
    ];

    // Five ranked support contacts. CFCR asks for a calling order, a consent
    // flag, and an address; the last question is ours — a name that cannot
    // actually take a child tonight belongs in a different row of the list.
    function contactBlock(n, req) {
      const ord = ["First call", "Second call", "Third call", "Fourth call", "Fifth call"][n - 1];
      const p = "c" + n + "_";
      const gate = n === 1 ? null : { field: "c" + (n - 1) + "_name", filled: true };
      const f = [
        { id: p + "name", label: ord + " — name", type: "text", req: req, group: ord,
          hint: n === 1 ? "Who the caregiver would actually call first." : undefined },
        { id: p + "role", label: "Who is this?", type: "select", options: [
            "Caregiver in the home", "Parent not in the home", "Grandparent", "Aunt or uncle",
            "Other relative", "Family friend or neighbour", "Godparent",
            "Child First clinician", "Child First FRP", "Therapist or other provider",
            "Child care or preschool staff", "DSS social worker", "Faith community", "Other",
          ] },
        { id: p + "relationship", label: "Relationship to {child}", type: "text" },
        { id: p + "phone", label: "Phone", type: "tel", req: req },
        { id: p + "address", label: "Address, or how far away they are", type: "text" },
        { id: p + "consent", label: "Valid consent to release information on file?", type: "radio",
          options: [
            { label: "Yes — on file" },
            { label: "No — call them, but share nothing clinical" },
            { label: "Requested, not yet signed", detail: "date", detailLabel: "Expected by" },
            { label: "Not needed — legally responsible person" },
          ] },
        { id: p + "care", label: "Can they care for {child} in a crisis?", type: "radio",
          options: [
            { label: "Yes — right away" },
            { label: "Yes — with some notice" },
            { label: "No — support for the caregiver only" },
            { label: "No — information only" },
          ] },
      ];
      return gate ? f.map((x) => ({ ...x, showIf: x.showIf || gate })) : f;
    }

    // ─────────────────────────────────────────────────────────────
    // Helpers
    // ─────────────────────────────────────────────────────────────

    // Option labels and stored answers always keep their raw {child} tokens.
    // Only the display layer resolves them, so a child's name can be added or
    // corrected at any point without rewriting answers already recorded.
    function firstName(answers) {
      const n = (answers.child_name || "").trim();
      if (!n) return "";
      if (n.indexOf(",") > -1) {
        const after = n.split(",")[1];
        if (after && after.trim()) return after.trim().split(/\s+/)[0];
      }
      return n.split(/\s+/)[0];
    }

    function tok(s, answers) {
      if (s === undefined || s === null) return s;
      const src = String(s);
      const fn = firstName(answers);
      const name = fn || "this child";
      const poss = fn ? fn + "’s" : "this child’s";
      const age = (answers.child_age || "").trim() || "young";
      const home = (answers.clinical_home || "").trim() || "the clinical home";
      let out = src
        .replace(/\{childs\}/g, poss)
        .replace(/\{child\}/g, name)
        .replace(/\{age\}/g, age)
        .replace(/\{clinicalhome\}/g, home);
      if (/^\{child/.test(src)) out = out.charAt(0).toUpperCase() + out.slice(1);
      return out;
    }

    function isVisible(field, answers) {
      if (!field.showIf) return true;
      const cond = field.showIf;
      const v = answers[cond.field];
      if (cond.filled !== undefined) {
        const filled = typeof v === "string" ? v.trim().length > 0 : Array.isArray(v) ? v.length > 0 : v !== undefined && v !== null && v !== "";
        return cond.filled ? filled : !filled;
      }
      if (cond.equals !== undefined) return v === cond.equals;
      if (cond.notEquals !== undefined) return v !== undefined && v !== cond.notEquals;
      if (cond.includes !== undefined) return Array.isArray(v) && v.includes(cond.includes);
      if (cond.inList !== undefined) return cond.inList.includes(v);
      return true;
    }

    function isAnswered(field, answers) {
      if (field.type === "note") return true;
      const v = answers[field.id];
      if (field.type === "check") return Array.isArray(v) && v.length > 0;
      if (field.type === "area" || field.type === "text" || field.type === "tel") {
        return typeof v === "string" && v.trim().length > 0;
      }
      return v !== undefined && v !== null && v !== "";
    }

    function formatAnswer(field, answers) {
      if (field.type === "note") return null;
      const v = answers[field.id];
      if (v === undefined || v === null || v === "") return null;
      if (field.type === "check") {
        if (!Array.isArray(v) || v.length === 0) return null;
        const parts = v.map((label) => {
          const d = answers[field.id + "::" + label];
          const shown = tok(label, answers);
          return d && d.trim() ? shown + " — " + d.trim() : shown;
        });
        return parts.join("; ");
      }
      if (field.type === "radio") {
        const opt = (field.options || []).find((o) => o.label === v);
        const d = answers[field.id + "::" + v];
        const shown = tok(v, answers);
        if (opt && opt.detail && d && d.trim()) return shown + " — " + d.trim();
        return shown;
      }
      if (typeof v === "string") return v.trim();
      return String(v);
    }

    const val = (answers, id) => {
      const v = answers[id];
      return typeof v === "string" ? v.trim() : "";
    };

    function fieldById(id) {
      for (const sec of CRISIS_SECTIONS) {
        const f = sec.fields.find((x) => x.id === id);
        if (f) return f;
      }
      return null;
    }

    function answerById(answers, id) {
      const f = fieldById(id);
      return f ? formatAnswer(f, answers) : null;
    }

    // The contacts, in calling order, as the family copy needs them.
    function contactList(answers) {
      const out = [];
      for (let n = 1; n <= 5; n++) {
        const name = val(answers, "c" + n + "_name");
        if (!name) continue;
        out.push({
          n,
          name,
          role: val(answers, "c" + n + "_role"),
          relationship: val(answers, "c" + n + "_relationship"),
          phone: val(answers, "c" + n + "_phone"),
          address: val(answers, "c" + n + "_address"),
          consent: val(answers, "c" + n + "_consent"),
          care: val(answers, "c" + n + "_care"),
        });
      }
      return out;
    }

    // ─────────────────────────────────────────────────────────────
    // Record copy — the clinical text, section by section, each one
    // labelled with the CFCR page it is keyed into.
    // ─────────────────────────────────────────────────────────────
    function summaryText(answers) {
      const name = val(answers, "child_name") || "(child name not entered)";
      const lines = [
        "CRISIS PLAN — CHILD (CFCR Crisis Plan rev. 10/23)",
        "",
        "This plan is written for the child named below. The caregiver completed it on",
        "the child’s behalf; the child’s own preferences are recorded as the caregiver",
        "reports them and the clinician observes them.",
        "",
        "Child: " + name,
        "CFCR ID: " + (val(answers, "child_id") || "—"),
        "Date of birth: " + (val(answers, "child_dob") || "—") + "   Age: " + (val(answers, "child_age") || "—"),
        "Legally responsible person: " + (val(answers, "lrp_name") || "—") +
          (val(answers, "lrp_relationship") ? " (" + val(answers, "lrp_relationship") + ")" : "") +
          (val(answers, "lrp_phone") ? " — " + val(answers, "lrp_phone") : ""),
        "Date of initial crisis plan: " + (val(answers, "plan_initial_date") || "—"),
        "Date of last revision: " + (val(answers, "plan_revision_date") || "—"),
        "Next review due: " + (val(answers, "plan_next_review") || "—"),
        "Generated: " + new Date().toLocaleString(),
        "",
      ];
      CRISIS_SECTIONS.forEach((sec) => {
        const visible = sec.fields.filter((f) => isVisible(f, answers) && f.type !== "note");
        const answered = visible.filter((f) => formatAnswer(f, answers) !== null);
        if (answered.length === 0) return;
        const head = "SECTION " + sec.num.toUpperCase() + ". " + tok(sec.title, answers).toUpperCase() +
          (sec.cfcrPage ? "   [CFCR page " + sec.cfcrPage + "]" : "");
        lines.push("=".repeat(70));
        lines.push(head);
        lines.push("=".repeat(70));
        let lastGroup = null;
        answered.forEach((f) => {
          const a = formatAnswer(f, answers);
          if (f.group && f.group !== lastGroup) {
            lines.push("");
            lines.push("[" + tok(f.group, answers) + "]");
            lastGroup = f.group;
          }
          lines.push("");
          lines.push(tok(f.label, answers));
          lines.push("  " + a.split("\n").join("\n  "));
        });
        lines.push("");
      });
      return lines.join("\n");
    }

    // ─────────────────────────────────────────────────────────────
    // Family copy — the same plan in the caregiver's language, ordered
    // the way a frightened adult reads at 2am: numbers, then people,
    // then what to do, then what not to do.
    // ─────────────────────────────────────────────────────────────
    function familyCardBlocks(answers) {
      const nm = firstName(answers) || "your child";
      const contacts = contactList(answers);
      const blocks = [];

      const push = (title, items) => {
        const keep = items.filter((i) => i && i.body && String(i.body).trim());
        if (keep.length) blocks.push({ title, items: keep });
      };

      let firstStep = answerById(answers, "after_hours");
      if (firstStep === "A named support person from Section 3") {
        const c1 = contacts[0];
        firstStep = c1
          ? "Call " + c1.name + (c1.phone ? " — " + c1.phone : "")
          : "Call your first support person.";
      }
      push("If you need help right now", [
        firstStep ? { label: "Start here", body: firstStep } : null,
        val(answers, "crisis_mobile") ? { label: "Mobile crisis — any hour", body: val(answers, "crisis_mobile") } : null,
        val(answers, "clinical_home_phone") ? { label: val(answers, "clinical_home") || "Clinical home", body: val(answers, "clinical_home_phone") } : null,
        val(answers, "lme_phone") ? { label: val(answers, "lme") || "LME-MCO", body: val(answers, "lme_phone") } : null,
        { label: "988 — call or text, any hour", body: "For " + nm + ", and for you. Calling 988 because you are at the end of your rope is using this plan correctly." },
        { label: "911", body: "Only if someone is in immediate danger of being hurt." },
        { label: "What to say when you call",
          body: "“" + (val(answers, "child_age")
            ? "I am calling about my child, who is " + val(answers, "child_age") + " old."
            : "I am calling about my young child.") +
            " There is a crisis plan on file with " + (val(answers, "clinical_home") || "our clinical home") + ".”" },
      ]);

      push("Call these people, in this order", [
        ...contacts.map((c) => ({
          label: c.n + ". " + c.name + (c.relationship ? " — " + c.relationship : c.role ? " — " + c.role : ""),
          body: [c.phone, c.care === "Yes — right away" ? "Can come right away" : c.care === "Yes — with some notice" ? "Can come with some notice" : ""]
            .filter(Boolean).join("  ·  "),
        })),
        answerById(answers, "do_not_contact") && val(answers, "do_not_contact") !== "No contact restrictions."
          ? { label: "Please do not call", body: val(answers, "do_not_contact") } : null,
      ]);

      push("The early signs", [
        { label: "What we notice first", body: val(answers, "early_signs_narrative") },
        { label: "How we can tell " + nm + " is overwhelmed", body: val(answers, "comm_distress") },
        { label: "Signs to watch for", body: answerById(answers, "early_signs") },
      ]);

      push("What helps " + nm, [
        { label: "Try these, in this order", body: val(answers, "helps_order") },
        { label: nm + " settles best for", body: val(answers, "helps_people") },
        { label: "Things that help", body: val(answers, "helps_objects") },
        { label: "Words that work", body: val(answers, "comm_calm") },
      ]);

      push("Please do not", [
        { label: "What makes it worse", body: val(answers, "do_not_do") },
        { label: "If someone new is helping " + nm, body: val(answers, "responder_guidance") },
      ]);

      push("How we know this is a crisis and not a hard day", [
        { label: "", body: val(answers, "crisis_threshold") },
      ]);

      push("Things a doctor or responder needs to know", [
        { label: "Allergies", body: val(answers, "allergies") },
        { label: "Medicines", body: val(answers, "meds") },
        { label: "Medicines that did not go well", body: val(answers, "meds_poor") },
        { label: "Health conditions", body: val(answers, "med_conditions") },
        { label: "Doctor", body: [val(answers, "pcp_name"), val(answers, "pcp_phone")].filter(Boolean).join(" — ") },
        { label: "If we need a hospital", body: val(answers, "ed_preferred") },
        { label: "Finding our home", body: val(answers, "home_access") },
      ]);

      push("If " + nm + " needs to go to the hospital", [
        { label: "Who stays with " + nm, body: val(answers, "who_stays") },
        { label: "Who coordinates everything", body: val(answers, "coord_primary") },
        { label: "The other children", body: val(answers, "sibling_plan") },
      ]);

      push(nm.charAt(0).toUpperCase() + nm.slice(1) + " on a good day", [
        { label: "This is what we are working back to", body: val(answers, "well") },
      ]);

      push("And for you", [
        { label: "What helps you stay steady", body: val(answers, "caregiver_own") },
        { label: "Why this matters", body: "A child this young borrows the calm of the adult holding them. Looking after yourself in the middle of this is part of the plan, not a distraction from it." },
      ]);

      return blocks;
    }

    function familyCardText(answers) {
      const nm = firstName(answers) || "Your child";
      const lines = [
        (firstName(answers) ? nm.toUpperCase() + "’S" : "YOUR CHILD’S") + " CRISIS PLAN — FAMILY COPY",
        "",
        "Age: " + (val(answers, "child_age") || "—") +
          (val(answers, "plan_revision_date") || val(answers, "plan_initial_date")
            ? "   Last updated: " + (val(answers, "plan_revision_date") || val(answers, "plan_initial_date"))
            : ""),
        "Keep this somewhere you can find it fast." + (val(answers, "doc_where") ? " Ours lives: " + val(answers, "doc_where") : ""),
        "",
      ];
      familyCardBlocks(answers).forEach((b) => {
        lines.push("—".repeat(46));
        lines.push(b.title.toUpperCase());
        lines.push("—".repeat(46));
        b.items.forEach((i) => {
          if (i.label) {
            lines.push(i.label + ":");
            lines.push("  " + String(i.body).split("\n").join("\n  "));
          } else {
            lines.push(String(i.body).split("\n").join("\n"));
          }
          lines.push("");
        });
      });
      lines.push("This is your copy, in plain language. The full plan is in " + (firstName(answers) ? nm + "’s" : "your child’s") + " record.");
      return lines.join("\n");
    }

    // ─────────────────────────────────────────────────────────────
    // Readiness check — the things a Medicaid or LME-MCO reviewer
    // looks for first, and the ones that make the plan usable at 2am.
    // ─────────────────────────────────────────────────────────────
    function readinessChecks(answers) {
      const blankAreas = [];
      CRISIS_SECTIONS.forEach((sec) => {
        sec.fields.forEach((f) => {
          if (f.type !== "area") return;
          if (!isVisible(f, answers)) return;
          if (!isAnswered(f, answers)) blankAreas.push({ sec, f });
        });
      });

      const contacts = contactList(answers);
      const withPhone = contacts.filter((c) => c.phone);
      const missingConsent = contacts.filter((c) => !c.consent);
      const nextReview = val(answers, "plan_next_review");
      const ladder = Array.isArray(answers.ladder) ? answers.ladder : [];
      const pages = ["cfcr_page1", "cfcr_page2", "cfcr_page3"].filter((id) => val(answers, id));

      return [
        { ok: !!val(answers, "child_name") && !!val(answers, "child_age"),
          label: "The child is named, with their age",
          detail: "Every prompt on the form reads back to a name. Without it the plan is about “this child.”" },
        { ok: !!val(answers, "lrp_name") && !!val(answers, "lrp_phone") && !!val(answers, "custody_status"),
          label: "Legally responsible person and custody status recorded",
          detail: "Who may consent for this child, and any court order that limits it." },
        { ok: !!val(answers, "plan_initial_date"),
          label: "Date of initial crisis plan",
          detail: "CFCR asks for it at the top of page 1." },
        { ok: !!nextReview,
          label: "Next review date set",
          detail: "A plan with no review date reads as a plan nobody came back to." },
        { ok: pages.length === 3,
          label: "All three CFCR page attestations answered",
          detail: pages.length + " of 3 answered. CFCR asks “Did you update this page?” once per page." },
        { ok: !!val(answers, "clinical_home_phone") && !!val(answers, "lme_phone") && !!val(answers, "crisis_mobile"),
          label: "24/7 numbers present — clinical home, LME-MCO, mobile crisis",
          detail: "Dialable numbers, not switchboards." },
        { ok: withPhone.length >= 2,
          label: "At least two ranked support contacts with phone numbers",
          detail: withPhone.length + " recorded. CFCR asks for a calling order, and the order is the useful part." },
        { ok: missingConsent.length === 0,
          label: "Consent-to-release answered for every named contact",
          detail: missingConsent.length === 0 ? "Every contact has a consent status." : missingConsent.length + " contact(s) with no consent status." },
        { ok: !!val(answers, "do_not_contact"),
          label: "Contact restrictions addressed",
          detail: "“No restrictions” is an answer. A blank reads as nobody asked." },
        { ok: !!val(answers, "allergies") && !!val(answers, "meds"),
          label: "Allergies and medications recorded",
          detail: "“No known allergies” and “no current medications” are answers. Blanks are not." },
        { ok: ladder.length > 0,
          label: "Least restrictive response steps documented",
          detail: ladder.length + " step(s) agreed. Medicaid expects natural and community supports before emergency services." },
        { ok: !!val(answers, "crisis_threshold"),
          label: "The line between a crisis and a hard day is written down",
          detail: "This is what keeps an ordinary hard Tuesday out of an emergency department." },
        { ok: !!val(answers, "do_not_do") && !!val(answers, "responder_guidance"),
          label: "What not to do, and how to approach this child",
          detail: "The two fields a stranger needs before they walk into the room." },
        { ok: !!val(answers, "debrief") && !!val(answers, "debrief_days"),
          label: "Post-crisis review has a named owner and a timeframe",
          detail: "A role is not an owner. Name the person and the number of days." },
        { ok: !!val(answers, "reviewed_with"),
          label: "Plan read through with the caregiver in plain language",
          detail: "Read together, in the order they would use it — not handed over." },
        { ok: !!val(answers, "copy_given") && val(answers, "copy_given").indexOf("Not yet") !== 0,
          label: "Legally responsible person has a copy",
          detail: "Print the family copy, or put a photo of it on their phone." },
        { ok: !!val(answers, "sig_caregiver") && !!val(answers, "sig_caregiver_date") && !!val(answers, "sig_clinician") && !!val(answers, "sig_clinician_date"),
          label: "Caregiver and clinician signatures, both dated",
          detail: "An unsigned plan is a draft." },
        { ok: blankAreas.length === 0,
          label: "No blank narrative fields",
          detail: blankAreas.length === 0
            ? "Every narrative field has something in it."
            : blankAreas.length + " blank. A reviewer reads a blank as work not done; most of these carry a one-tap “nothing to report” filler.",
          blanks: blankAreas },
      ];
    }

    // ─────────────────────────────────────────────────────────────
    // Small pieces
    // ─────────────────────────────────────────────────────────────
    const Eyebrow = ({ children, dark }) => (
      <div
        className="cib-body text-xs font-bold uppercase tracking-widest mb-2"
        style={{ color: dark ? "var(--soft-on-dark)" : "var(--moss)", letterSpacing: "0.14em" }}
      >
        {children}
      </div>
    );

    const Req = () => <span style={{ color: "var(--lamplight)" }} title="Required in CFCR"> *</span>;

    const FamilyTag = () => (
      <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full ml-2 align-middle"
        style={{ background: "rgba(127,160,140,0.22)", color: "var(--moss)", letterSpacing: "0.1em" }}
        title="This answer is printed on the family's plain-language copy">
        Family copy
      </span>
    );

    // A standing reminder of whose plan this is. It sits above every
    // section, because the person the plan is for is not in the room
    // answering for themselves.
    function ChildBanner({ answers }) {
      const nm = val(answers, "child_name");
      const age = val(answers, "child_age");
      return (
        <div className="rounded-2xl px-4 py-3 mb-6" style={{ background: "rgba(242,182,83,0.12)", border: "1px solid rgba(242,182,83,0.4)" }}>
          <div className="text-xs font-bold uppercase tracking-widest mb-1" style={{ color: "var(--lamplight)", letterSpacing: "0.12em" }}>
            This plan is for the child
          </div>
          <div className="text-sm" style={{ color: "var(--cream-on-dark)" }}>
            {nm
              ? <span><strong>{nm}</strong>{age ? ", " + age : ""}. The caregiver is answering on {firstName(answers) || "their"}{firstName(answers) ? "’s" : ""} behalf.</span>
              : <span>Add the child&rsquo;s name in Section i and every question will use it.</span>}
          </div>
        </div>
      );
    }

    function NoteView({ field, answers }) {
      const tone = field.tone === "child"
        ? { bg: "rgba(127,160,140,0.14)", border: "rgba(127,160,140,0.45)", label: "var(--moss)" }
        : field.tone === "alert"
          ? { bg: "rgba(180,85,46,0.14)", border: "rgba(196,122,137,0.5)", label: "var(--rose-soft)" }
          : { bg: "rgba(255,255,255,0.06)", border: "rgba(255,255,255,0.16)", label: "var(--soft-on-dark)" };
      return (
        <div className="rounded-2xl p-4 mb-8" style={{ background: tone.bg, border: "1px solid " + tone.border }}>
          <div className="text-sm font-bold mb-1" style={{ color: tone.label }}>{tok(field.title, answers)}</div>
          <p className="text-sm leading-relaxed" style={{ color: "var(--cream-on-dark)" }}>{tok(field.body, answers)}</p>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────
    // Title card shown at the start of the plan
    // ─────────────────────────────────────────────────────────────
    function AssessmentIntro({ eyebrow, title, subtitle, purpose, meta, accent, beginLabel, backLabel, onBegin, onBack }) {
      return (
        <div className="cib-body min-h-screen w-full flex flex-col animate-[cibFade_320ms_ease_both]" style={{ background: "var(--spruce-deep)", color: "var(--cream-on-dark)" }}>
          <div className="max-w-md mx-auto w-full px-5 pt-6 pb-8 flex flex-col flex-1">
            <button
              onClick={onBack}
              className="self-start text-xs font-bold uppercase tracking-wider transition-colors hover:text-white"
              style={{ color: "var(--soft-on-dark)" }}
            >
              &larr; {backLabel || "Back"}
            </button>

            <div className="flex-1 flex flex-col justify-center py-10 cib-fade">
              <div className="rounded-3xl p-7" style={{ background: "rgba(255,255,255,0.07)", border: "1px solid rgba(255,255,255,0.14)" }}>
                {eyebrow ? (
                  <div className="cib-body text-xs font-bold uppercase tracking-widest mb-3" style={{ color: accent || "var(--lamplight)", letterSpacing: "0.14em" }}>
                    {eyebrow}
                  </div>
                ) : null}
                <h1 className="cib-display text-3xl leading-tight mb-2" style={{ color: "var(--cream-on-dark)" }}>{title}</h1>
                {subtitle ? <p className="text-sm" style={{ color: "var(--soft-on-dark)" }}>{subtitle}</p> : null}

                <div className="h-px w-full my-5" style={{ background: "rgba(255,255,255,0.14)" }} />

                <p className="text-base leading-relaxed" style={{ color: "var(--cream-on-dark)" }}>{purpose}</p>

                {Array.isArray(meta) && meta.length > 0 && (
                  <div className="flex flex-wrap gap-2 mt-6">
                    {meta.map((m) => (
                      <span key={m} className="text-xs font-bold px-3 py-1.5 rounded-full" style={{ background: "rgba(255,255,255,0.09)", color: "var(--soft-on-dark)" }}>
                        {m}
                      </span>
                    ))}
                  </div>
                )}
              </div>
            </div>

            <button
              onClick={onBegin}
              className="w-full rounded-2xl py-4 text-lg font-bold transition-transform active:scale-[0.98]"
              style={{ background: "var(--cream-on-dark)", color: "var(--spruce-deep)" }}
            >
              {beginLabel || "Begin"}
            </button>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────
    // Field renderer (dark fill mode)
    // ─────────────────────────────────────────────────────────────
    function FieldView({ field, answers, setField, setDetail }) {
      const value = answers[field.id];
      const inputStyle = { background: "rgba(255,255,255,0.07)", color: "var(--cream-on-dark)", border: "1px solid rgba(255,255,255,0.14)" };

      if (field.type === "note") return <NoteView field={field} answers={answers} />;

      const labelBlock = (
        <div className="mb-3">
          <div className="text-base font-bold leading-snug" style={{ color: "var(--cream-on-dark)" }}>
            {tok(field.label, answers)}{field.req ? <Req /> : null}{field.family ? <FamilyTag /> : null}
          </div>
          {field.hint && (
            <p className="text-xs mt-2 leading-relaxed" style={{ color: "var(--soft-on-dark)" }}>{tok(field.hint, answers)}</p>
          )}
        </div>
      );

      // One tap to say "there is nothing here" — because a blank field in a
      // Medicaid record reads as a question nobody asked.
      const noneChip = field.noneLabel && !(typeof value === "string" && value.trim())
        ? (
          <button
            onClick={() => setField(field.id, tok(field.noneLabel, answers))}
            className="mt-2 text-xs font-bold px-3 py-2 rounded-xl transition-colors hover:bg-white/10"
            style={{ background: "rgba(255,255,255,0.05)", color: "var(--soft-on-dark)", border: "1px dashed rgba(255,255,255,0.25)" }}
          >
            Nothing to report &rarr; {tok(field.noneLabel, answers)}
          </button>
        ) : null;

      if (field.type === "text" || field.type === "date" || field.type === "tel") {
        return (
          <div className="mb-8">
            {labelBlock}
            <input
              type={field.type === "tel" ? "tel" : field.type}
              inputMode={field.type === "tel" ? "tel" : undefined}
              value={typeof value === "string" ? value : ""}
              onChange={(e) => setField(field.id, e.target.value)}
              className="w-full rounded-2xl px-4 py-3 text-base focus:outline-none"
              style={{ ...inputStyle, colorScheme: "dark" }}
            />
            {noneChip}
          </div>
        );
      }

      if (field.type === "select") {
        return (
          <div className="mb-8">
            {labelBlock}
            <select
              value={typeof value === "string" ? value : ""}
              onChange={(e) => setField(field.id, e.target.value)}
              className="w-full rounded-2xl px-4 py-3 text-base focus:outline-none"
              style={{ ...inputStyle, colorScheme: "dark" }}
            >
              <option value="">Select&hellip;</option>
              {field.options.map((o) => <option key={o} value={o}>{tok(o, answers)}</option>)}
            </select>
          </div>
        );
      }

      if (field.type === "area") {
        return (
          <div className="mb-8">
            {labelBlock}
            <textarea
              value={typeof value === "string" ? value : ""}
              onChange={(e) => setField(field.id, e.target.value)}
              rows={field.rows || 4}
              placeholder="Type here&hellip;"
              className="w-full rounded-2xl p-4 text-base resize-y focus:outline-none"
              style={inputStyle}
            />
            {noneChip}
          </div>
        );
      }

      if (field.type === "radio") {
        return (
          <div className="mb-8">
            {labelBlock}
            <div className="flex flex-col gap-2">
              {field.options.map((opt) => {
                const selected = value === opt.label;
                return (
                  <div key={opt.label}>
                    <button
                      onClick={() => setField(field.id, opt.label)}
                      className="w-full rounded-2xl py-3 px-4 text-left text-sm font-bold transition-all active:scale-[0.99]"
                      style={selected
                        ? { background: "var(--lamplight)", color: "var(--spruce-deep)", boxShadow: "0 0 0 3px rgba(242,182,83,0.35)" }
                        : { background: "rgba(255,255,255,0.07)", color: "var(--cream-on-dark)", border: "1px solid rgba(255,255,255,0.14)" }}
                    >
                      {tok(opt.label, answers)}
                    </button>
                    {selected && opt.detail === "text" && (
                      <input
                        value={answers[field.id + "::" + opt.label] || ""}
                        onChange={(e) => setDetail(field.id, opt.label, e.target.value)}
                        placeholder={tok(opt.detailLabel || "Please describe", answers)}
                        className="w-full rounded-2xl px-4 py-3 mt-2 text-sm focus:outline-none"
                        style={{ ...inputStyle, border: "1px solid rgba(242,182,83,0.5)" }}
                      />
                    )}
                    {selected && opt.detail === "date" && (
                      <input
                        type="date"
                        value={answers[field.id + "::" + opt.label] || ""}
                        onChange={(e) => setDetail(field.id, opt.label, e.target.value)}
                        aria-label={tok(opt.detailLabel || "Date", answers)}
                        className="w-full rounded-2xl px-4 py-3 mt-2 text-sm focus:outline-none"
                        style={{ ...inputStyle, border: "1px solid rgba(242,182,83,0.5)", colorScheme: "dark" }}
                      />
                    )}
                    {selected && opt.detail === "area" && (
                      <textarea
                        value={answers[field.id + "::" + opt.label] || ""}
                        onChange={(e) => setDetail(field.id, opt.label, e.target.value)}
                        placeholder={tok(opt.detailLabel || "Please describe", answers)}
                        rows={3}
                        className="w-full rounded-2xl p-4 mt-2 text-sm resize-y focus:outline-none"
                        style={{ ...inputStyle, border: "1px solid rgba(242,182,83,0.5)" }}
                      />
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      if (field.type === "check") {
        const arr = Array.isArray(value) ? value : [];
        const toggle = (label) => {
          if (arr.includes(label)) setField(field.id, arr.filter((x) => x !== label));
          else setField(field.id, [...arr, label]);
        };
        return (
          <div className="mb-8">
            {labelBlock}
            <div className="flex flex-col gap-2">
              {field.options.map((opt) => {
                const checked = arr.includes(opt.label);
                return (
                  <div key={opt.label}>
                    <button
                      onClick={() => toggle(opt.label)}
                      className="w-full rounded-2xl py-3 px-4 text-left text-sm font-bold transition-all active:scale-[0.99] flex items-start gap-3"
                      style={checked
                        ? { background: "var(--moss)", color: "var(--spruce-deep)" }
                        : { background: "rgba(255,255,255,0.07)", color: "var(--cream-on-dark)", border: "1px solid rgba(255,255,255,0.14)" }}
                    >
                      <span className="flex-shrink-0 w-5 h-5 rounded-md mt-0.5 flex items-center justify-center text-xs"
                        style={checked
                          ? { background: "var(--spruce-deep)", color: "var(--lamplight)" }
                          : { border: "2px solid rgba(255,255,255,0.35)", color: "transparent" }}
                      >&#10003;</span>
                      <span>{tok(opt.label, answers)}</span>
                    </button>
                    {checked && opt.detail === "text" && (
                      <input
                        value={answers[field.id + "::" + opt.label] || ""}
                        onChange={(e) => setDetail(field.id, opt.label, e.target.value)}
                        placeholder={tok(opt.detailLabel || "Please specify", answers)}
                        className="w-full rounded-2xl px-4 py-3 mt-2 text-sm focus:outline-none"
                        style={{ ...inputStyle, border: "1px solid rgba(127,160,140,0.6)" }}
                      />
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      return null;
    }

    // ─────────────────────────────────────────────────────────────
    // The family's copy — light, plain, and built to be printed and
    // stuck on a fridge.
    // ─────────────────────────────────────────────────────────────
    function FamilyCard({ answers }) {
      const nm = firstName(answers);
      const blocks = familyCardBlocks(answers);
      const updated = val(answers, "plan_revision_date") || val(answers, "plan_initial_date");
      return (
        <div id="familycard" className="max-w-md mx-auto px-5 py-8" style={{ background: "var(--card)" }}>
          <div className="text-xs font-bold uppercase tracking-widest mb-1" style={{ color: "var(--moss)", letterSpacing: "0.14em" }}>
            Family copy
          </div>
          <h1 className="cib-display text-3xl leading-tight mb-1" style={{ color: "var(--spruce)" }}>
            {nm ? nm + "’s crisis plan" : "Your child’s crisis plan"}
          </h1>
          <p className="text-sm mb-1" style={{ color: "var(--ink-soft)" }}>
            {val(answers, "child_age") ? "Age " + val(answers, "child_age") + "." : ""}
            {updated ? " Last updated " + updated + "." : ""}
          </p>
          <p className="text-sm mb-6" style={{ color: "var(--ink-soft)" }}>
            Keep this where you can find it fast.
            {val(answers, "doc_where") ? " Ours lives: " + val(answers, "doc_where") + "." : ""}
          </p>

          {blocks.length === 0 && (
            <p className="text-sm" style={{ color: "var(--ink-soft)" }}>
              Nothing to print yet. The family copy fills in from the answers marked
              &ldquo;Family copy&rdquo; as you work through the plan.
            </p>
          )}

          {blocks.map((b, bi) => (
            <div key={b.title} className="mb-5 rounded-2xl p-4"
              style={{ background: bi === 0 ? "rgba(242,182,83,0.13)" : "var(--paper)", border: "1px solid " + (bi === 0 ? "rgba(217,154,43,0.5)" : "var(--mist)") }}>
              <h2 className="cib-display text-lg leading-snug mb-3" style={{ color: "var(--spruce)" }}>{b.title}</h2>
              {b.items.map((i, ii) => (
                <div key={ii} className="py-2" style={ii < b.items.length - 1 ? { borderBottom: "1px solid var(--mist)" } : {}}>
                  {/* Not uppercased: these labels carry people's names and phone numbers,
                      and a caregiver should not have to read their own mother's name in caps. */}
                  {i.label ? (
                    <div className="text-sm font-bold mb-1" style={{ color: "var(--ink-soft)" }}>{i.label}</div>
                  ) : null}
                  <div className="text-sm whitespace-pre-wrap leading-relaxed" style={{ color: "var(--ink)" }}>{i.body}</div>
                </div>
              ))}
            </div>
          ))}

          <p className="text-xs mt-6 pt-4" style={{ color: "var(--ink-soft)", borderTop: "1px solid var(--mist)" }}>
            This is your copy, in plain language. The full plan is in {nm ? nm + "’s" : "your child’s"} record.
            If anything here is wrong or out of date, tell us and we will change it.
          </p>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────
    // Main App
    // ─────────────────────────────────────────────────────────────
    function App() {
      const [mode, setMode] = useState("home"); // home | intro | fill | done | family
      const [answers, setAnswers] = useState({});
      const [secIdx, setSecIdx] = useState(0);
      const [saveState, setSaveState] = useState("idle");
      const [copied, setCopied] = useState("");
      const [confirmClear, setConfirmClear] = useState(false);
      const loadedRef = useRef(false);
      const topRef = useRef(null);

      // Load saved answers
      useEffect(() => {
        let alive = true;
        (async () => {
          try {
            if (!window.storage) {
              if (alive) setSaveState("off");
              loadedRef.current = true;
              return;
            }
            const result = await window.storage.get(STORAGE_KEY_CRISIS);
            if (alive && result && result.value) {
              const parsed = JSON.parse(result.value);
              if (parsed && typeof parsed === "object") setAnswers(parsed);
            }
          } catch (e) {
            // ignore
          } finally {
            loadedRef.current = true;
          }
        })();
        return () => { alive = false; };
      }, []);

      // Autosave answers
      useEffect(() => {
        if (!loadedRef.current) return;
        let cancelled = false;
        const t = setTimeout(async () => {
          try {
            if (!window.storage) return;
            await window.storage.set(STORAGE_KEY_CRISIS, JSON.stringify(answers));
            if (!cancelled) {
              setSaveState("saved");
              setTimeout(() => { if (!cancelled) setSaveState("idle"); }, 1500);
            }
          } catch (e) {
            if (!cancelled) setSaveState("off");
          }
        }, 600);
        return () => { cancelled = true; clearTimeout(t); };
      }, [answers]);

      const setField = (id, v) => setAnswers((a) => ({ ...a, [id]: v }));
      const setDetail = (id, label, v) => setAnswers((a) => ({ ...a, [id + "::" + label]: v }));

      const answeredAny = Object.keys(answers).length > 0;
      const totalRequired = CRISIS_SECTIONS.reduce((n, sec) => n + sec.fields.filter((f) => f.req).length, 0);

      const section = CRISIS_SECTIONS[secIdx];
      const visibleFields = section ? section.fields.filter((f) => isVisible(f, answers)) : [];
      const progress = ((secIdx + 1) / CRISIS_SECTIONS.length) * 100;

      const sectionCompletion = (sec) => {
        const vis = sec.fields.filter((f) => isVisible(f, answers) && f.req);
        if (vis.length === 0) return 1;
        const done = vis.filter((f) => isAnswered(f, answers)).length;
        return done / vis.length;
      };

      const scrollTop = () => {
        if (topRef.current && topRef.current.scrollIntoView) {
          topRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
        } else {
          window.scrollTo(0, 0);
        }
      };

      const goNext = () => {
        if (secIdx + 1 >= CRISIS_SECTIONS.length) setMode("done");
        else setSecIdx(secIdx + 1);
        scrollTop();
      };
      const goBack = () => {
        if (secIdx === 0) setMode("intro");
        else setSecIdx(secIdx - 1);
        scrollTop();
      };
      const jumpTo = (sectionId) => {
        const i = CRISIS_SECTIONS.findIndex((s) => s.id === sectionId);
        if (i >= 0) { setSecIdx(i); setMode("fill"); scrollTop(); }
      };

      const clearAll = () => {
        if (!confirmClear) {
          setConfirmClear(true);
          setTimeout(() => setConfirmClear(false), 3000);
          return;
        }
        setConfirmClear(false);
        setAnswers({});
        setSecIdx(0);
        setMode("home");
      };

      const copy = async (text, which) => {
        try {
          await navigator.clipboard.writeText(text);
          setCopied(which);
        } catch (e) {
          try {
            const ta = document.createElement("textarea");
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
            setCopied(which);
          } catch (err) {
            setCopied("");
          }
        }
        setTimeout(() => setCopied(""), 2000);
      };

      const printCard = () => {
        document.body.classList.add("printing-card");
        window.print();
        setTimeout(() => document.body.classList.remove("printing-card"), 500);
      };

      const checks = readinessChecks(answers);
      const checksOk = checks.filter((c) => c.ok).length;

      // ─── HOME ───
      if (mode === "home") {
        return (
          <div className="cib-body min-h-screen w-full animate-[cibFade_320ms_ease_both]" style={{ background: "var(--paper)", color: "var(--ink)" }}>
            <div className="max-w-md mx-auto px-5 py-10 pb-32">
              <a href="index.html" className="inline-block text-xs font-bold uppercase tracking-wider mb-6 transition-colors hover:text-[#7FA08C]" style={{ color: "var(--ink-soft)" }}>
                &larr; Back to Assessment Recorders
              </a>

              <Eyebrow>Child First Clinical Record</Eyebrow>
              <h1 className="cib-display text-3xl leading-tight mb-2" style={{ color: "var(--spruce)" }}>
                Crisis Plan for a Young Child
              </h1>
              <p className="text-sm mb-6" style={{ color: "var(--ink-soft)" }}>
                The CFCR Crisis Plan (rev. 10/23), rewritten for a client who is three years old
                and cannot fill out a form about themselves. Work section by section &mdash;
                everything autosaves on this device so you can stop and come back.
                {saveState === "saved" && <span style={{ color: "var(--moss)" }}> Saved.</span>}
                {saveState === "off" && <span> Saving is off here.</span>}
              </p>

              <div className="rounded-2xl p-4 mb-4" style={{ background: "var(--card)", border: "1px solid var(--lamplight)" }}>
                <Eyebrow>Whose plan this is</Eyebrow>
                <p className="text-xs leading-relaxed" style={{ color: "var(--ink-soft)" }}>
                  The state form is written in the first person &mdash; <em>what I am like when I am
                  feeling well</em>, <em>who will visit me in hospital</em>. A child in Child First
                  cannot answer that, so every prompt here is rewritten in the third person and
                  names the child out loud. The adults in the room are answering
                  <strong> on the child&rsquo;s behalf</strong>, and the child&rsquo;s own
                  preferences are recorded as the caregiver reports them and the clinician
                  observes them. Caregiver needs appear only where they change what happens to
                  the child.
                </p>
              </div>

              <div className="rounded-2xl p-4 mb-6" style={{ background: "var(--card)", border: "1px solid var(--mist)" }}>
                <Eyebrow>Before you begin</Eyebrow>
                <p className="text-xs mb-2 leading-relaxed" style={{ color: "var(--ink-soft)" }}>
                  Fields marked <span style={{ color: "var(--lamplight-deep)" }}>*</span> are
                  required in CFCR. Narrative fields carry a one-tap
                  &ldquo;nothing to report&rdquo; filler, because a reviewer reads a blank as a
                  question nobody asked. Answers marked <strong>Family copy</strong> are printed
                  on the caregiver&rsquo;s plain-language page, so write those in the
                  caregiver&rsquo;s own words.
                </p>
                <p className="text-xs" style={{ color: "var(--ink-soft)" }}>
                  <strong>{CRISIS_SECTIONS.length} sections</strong> &middot; {totalRequired} required
                  fields &middot; two outputs: the record copy for CFCR and the family copy for the fridge.
                </p>
              </div>

              <Eyebrow>Sections</Eyebrow>
              <div className="flex flex-col gap-2 mb-8">
                {CRISIS_SECTIONS.map((sec, i) => {
                  const c = sectionCompletion(sec);
                  return (
                    <button
                      key={sec.id}
                      onClick={() => { setSecIdx(i); setMode("fill"); }}
                      className="w-full rounded-2xl p-4 text-left transition-all active:scale-[0.99] hover:border-[#7FA08C]"
                      style={{ background: "var(--card)", border: "1px solid var(--mist)" }}
                    >
                      <div className="flex items-center justify-between gap-3">
                        <div className="flex items-center gap-3">
                          <span className="cib-display text-lg w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0"
                            style={{ background: c >= 1 ? "var(--moss)" : "var(--mist)", color: c >= 1 ? "var(--spruce-deep)" : "var(--spruce)" }}>
                            {sec.num}
                          </span>
                          <div>
                            <div className="font-bold text-sm" style={{ color: "var(--spruce)" }}>{tok(sec.title, answers)}</div>
                            <div className="text-xs" style={{ color: "var(--ink-soft)" }}>{tok(sec.blurb, answers)}</div>
                            {sec.cfcrPage && (
                              <div className="text-xs mt-1" style={{ color: "var(--moss)" }}>CFCR page {sec.cfcrPage}</div>
                            )}
                          </div>
                        </div>
                        {c >= 1
                          ? <span className="text-xs font-bold flex-shrink-0" style={{ color: "var(--moss)" }}>&#10003;</span>
                          : c > 0
                            ? <span className="text-xs font-bold flex-shrink-0" style={{ color: "var(--lamplight-deep)" }}>{Math.round(c * 100)}%</span>
                            : null}
                      </div>
                    </button>
                  );
                })}
              </div>

              <div className="flex gap-3">
                <button
                  onClick={() => { setSecIdx(0); setMode("intro"); }}
                  className="flex-1 rounded-2xl py-4 text-base font-bold transition-transform active:scale-[0.98]"
                  style={{ background: "var(--spruce)", color: "var(--cream-on-dark)" }}
                >
                  {answeredAny ? "Resume" : "Start"} crisis plan
                </button>
                {answeredAny && (
                  <button
                    onClick={() => setMode("done")}
                    className="flex-1 rounded-2xl py-4 text-base font-bold transition-colors hover:bg-[#FAF8F5]"
                    style={{ background: "var(--card)", color: "var(--spruce)", border: "1px solid var(--mist)" }}
                  >
                    Review &amp; copy
                  </button>
                )}
              </div>
              {answeredAny && (
                <button onClick={() => setMode("family")} className="w-full rounded-2xl py-3 mt-2 text-sm font-bold transition-colors hover:bg-[#FAF8F5]"
                  style={{ background: "var(--card)", color: "var(--spruce)", border: "1px solid var(--moss)" }}>
                  Family copy
                </button>
              )}
              {answeredAny && (
                <button onClick={clearAll} className="w-full py-3 mt-2 text-sm transition-colors" style={{ color: confirmClear ? "var(--alert)" : "var(--ink-soft)" }}>
                  {confirmClear ? "Tap again to erase all answers" : "Clear all answers"}
                </button>
              )}

              <div className="text-center text-xs mt-8 pt-6" style={{ color: "var(--ink-soft)", borderTop: "1px solid var(--mist)" }}>
                <p>
                  A recording convenience only. The plan in the clinical record is the plan.
                  Clinical judgement, CFCR data entry, and every crisis decision remain the
                  responsibility of the clinician.
                </p>
              </div>
            </div>
          </div>
        );
      }

      // ─── INTRO ───
      if (mode === "intro") {
        return (
          <AssessmentIntro
            eyebrow="Child First Clinical Record"
            title="Crisis Plan for a Young Child"
            subtitle="CFCR Crisis Plan, rev. 10/23 &mdash; written for the child"
            purpose="A crisis plan for a child under five is not a plan the client can follow. It is a set of instructions for the adults: what this child is like on a good day, the early signs, what helps and in what order, what makes it worse, who to call first, and where the line is between a hard day and a crisis. The child is the client. The caregiver answers on their behalf."
            meta={[CRISIS_SECTIONS.length + " sections", totalRequired + " required fields", "Record copy + family copy", "Autosaves on this device"]}
            accent="var(--lamplight)"
            beginLabel={answeredAny ? "Continue" : "Begin"}
            backLabel="Back to sections"
            onBegin={() => setMode("fill")}
            onBack={() => setMode("home")}
          />
        );
      }

      // ─── FILL ───
      if (mode === "fill") {
        let lastGroup = null;
        return (
          <div ref={topRef} className="cib-body min-h-screen w-full flex flex-col animate-[cibFade_320ms_ease_both]" style={{ background: "var(--spruce-deep)", color: "var(--cream-on-dark)" }}>
            <div className="max-w-md mx-auto w-full px-5 pt-6 pb-10 flex flex-col flex-1">
              <div className="mb-6">
                <div className="flex justify-between items-baseline mb-2">
                  <button onClick={() => setMode("home")} className="text-xs font-bold uppercase tracking-wider" style={{ color: "var(--soft-on-dark)" }}>
                    &larr; Sections
                  </button>
                  <span className="text-sm" style={{ color: "var(--soft-on-dark)" }}>
                    Section {section.num} &middot; {secIdx + 1} of {CRISIS_SECTIONS.length}
                    {section.cfcrPage ? " · CFCR p." + section.cfcrPage : ""}
                    {saveState === "saved" && <span style={{ color: "var(--moss)" }}> &middot; Saved</span>}
                  </span>
                </div>
                <div className="h-1 rounded-full w-full" style={{ background: "rgba(255,255,255,0.12)" }}>
                  <div className="h-1 rounded-full" style={{ width: progress + "%", background: "var(--lamplight)", transition: "width 300ms ease" }} />
                </div>
              </div>

              <ChildBanner answers={answers} />

              <div key={section.id} className="cib-fade flex-1">
                <Eyebrow dark>Section {section.num}</Eyebrow>
                <h1 className="cib-display text-2xl leading-snug mb-2" style={{ color: "var(--cream-on-dark)" }}>
                  {tok(section.title, answers)}
                </h1>
                <p className="text-sm mb-8" style={{ color: "var(--soft-on-dark)" }}>{tok(section.blurb, answers)}</p>

                {visibleFields.map((f) => {
                  const showGroup = f.group && f.group !== lastGroup;
                  if (f.group) lastGroup = f.group;
                  return (
                    <React.Fragment key={f.id}>
                      {showGroup && (
                        <div className="mt-2 mb-4 pt-4" style={{ borderTop: "1px solid rgba(255,255,255,0.14)" }}>
                          <Eyebrow dark>{tok(f.group, answers)}</Eyebrow>
                        </div>
                      )}
                      <FieldView field={f} answers={answers} setField={setField} setDetail={setDetail} />
                    </React.Fragment>
                  );
                })}
              </div>

              <div className="flex gap-3 mt-4">
                <button onClick={goBack} className="rounded-2xl py-4 px-6 text-base font-bold transition-colors hover:bg-white/10" style={{ background: "rgba(255,255,255,0.07)", color: "var(--cream-on-dark)", border: "1px solid rgba(255,255,255,0.14)" }}>
                  Back
                </button>
                <button onClick={goNext} className="flex-1 rounded-2xl py-4 text-base font-bold transition-colors hover:bg-opacity-90" style={{ background: "var(--cream-on-dark)", color: "var(--spruce-deep)" }}>
                  {secIdx + 1 >= CRISIS_SECTIONS.length ? "Finish & review" : "Next section"}
                </button>
              </div>
            </div>
          </div>
        );
      }

      // ─── FAMILY COPY ───
      if (mode === "family") {
        return (
          <div className="cib-body min-h-screen w-full animate-[cibFade_320ms_ease_both]" style={{ background: "var(--paper)", color: "var(--ink)" }}>
            <div className="max-w-md mx-auto px-5 py-8 no-print">
              <button onClick={() => setMode("done")} className="text-xs font-bold uppercase tracking-wider mb-4 transition-colors hover:text-[#7FA08C]" style={{ color: "var(--ink-soft)" }}>
                &larr; Back to review
              </button>
              <p className="text-xs leading-relaxed mb-4" style={{ color: "var(--ink-soft)" }}>
                This is the page that goes home. It says the same things as the record copy, in the
                caregiver&rsquo;s language, in the order someone reads at 2am: the numbers, then the
                people, then what to try, then what not to do. Read it out loud with them before
                they leave, and give them a copy on paper and a photo on their phone.
              </p>
            </div>

            <div className="rounded-2xl mx-auto max-w-md" style={{ border: "1px solid var(--mist)", background: "var(--card)" }}>
              <FamilyCard answers={answers} />
            </div>

            <div className="max-w-md mx-auto px-5 py-6 no-print flex gap-3">
              <button onClick={printCard} className="flex-1 rounded-2xl py-4 text-base font-bold transition-transform active:scale-[0.98]" style={{ background: "var(--spruce)", color: "var(--cream-on-dark)" }}>
                Print
              </button>
              <button onClick={() => copy(familyCardText(answers), "family")} className="flex-1 rounded-2xl py-4 text-base font-bold transition-colors hover:bg-[#FAF8F5]" style={{ background: "var(--card)", color: "var(--spruce)", border: "1px solid var(--mist)" }}>
                {copied === "family" ? "Copied" : "Copy as text"}
              </button>
            </div>
          </div>
        );
      }

      // ─── DONE / REVIEW ───
      const unansweredRequired = [];
      CRISIS_SECTIONS.forEach((sec) => {
        sec.fields.forEach((f) => {
          if (f.req && isVisible(f, answers) && !isAnswered(f, answers)) unansweredRequired.push({ sec, f });
        });
      });

      return (
        <div className="cib-body min-h-screen w-full animate-[cibFade_320ms_ease_both]" style={{ background: "var(--paper)", color: "var(--ink)" }}>
          <div className="max-w-md mx-auto px-4 py-8 cib-fade">
            <button onClick={() => setMode("home")} className="text-xs font-bold uppercase tracking-wider mb-4 transition-colors hover:text-[#7FA08C]" style={{ color: "var(--ink-soft)" }}>
              &larr; Back to sections
            </button>
            <Eyebrow>Review</Eyebrow>
            <h1 className="cib-display text-3xl mb-2" style={{ color: "var(--spruce)" }}>
              {firstName(answers) ? firstName(answers) + "’s crisis plan" : "Crisis plan"}
            </h1>
            <p className="text-sm mb-6" style={{ color: "var(--ink-soft)" }}>
              {val(answers, "child_name") ? <span><strong>{val(answers, "child_name")}</strong>{val(answers, "child_age") ? ", " + val(answers, "child_age") : ""} &middot; </span> : null}
              {unansweredRequired.length === 0
                ? "All required fields are answered."
                : unansweredRequired.length + " required field" + (unansweredRequired.length === 1 ? "" : "s") + " still blank (marked *)."}
            </p>

            <div className="rounded-2xl p-4 mb-4" style={{ background: "var(--card)", border: "1px solid " + (checksOk === checks.length ? "var(--moss)" : "var(--lamplight)") }}>
              <Eyebrow>Readiness check &middot; {checksOk} of {checks.length}</Eyebrow>
              <p className="text-xs mb-3" style={{ color: "var(--ink-soft)" }}>
                What a Medicaid or LME-MCO reviewer looks for first, and what makes this plan
                usable in the moment.
              </p>
              {checks.map((c) => (
                <div key={c.label} className="flex items-start gap-3 py-2" style={{ borderTop: "1px solid var(--mist)" }}>
                  <span className="flex-shrink-0 w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold mt-0.5"
                    style={c.ok
                      ? { background: "var(--moss)", color: "var(--spruce-deep)" }
                      : { background: "rgba(217,154,43,0.2)", color: "var(--lamplight-deep)", border: "1px solid var(--lamplight-deep)" }}>
                    {c.ok ? "✓" : "!"}
                  </span>
                  <div>
                    <div className="text-sm font-bold" style={{ color: c.ok ? "var(--spruce)" : "var(--ink)" }}>{c.label}</div>
                    {!c.ok && <div className="text-xs mt-0.5" style={{ color: "var(--ink-soft)" }}>{c.detail}</div>}
                    {!c.ok && c.blanks && c.blanks.length > 0 && (
                      <div className="mt-2">
                        {c.blanks.slice(0, 8).map(({ sec, f }) => (
                          <button key={f.id} onClick={() => jumpTo(sec.id)} className="block text-left text-xs py-0.5 transition-colors hover:text-[#7FA08C]" style={{ color: "var(--ink-soft)" }}>
                            &rarr; &sect;{sec.num}: {tok(f.label, answers)}
                          </button>
                        ))}
                        {c.blanks.length > 8 && <p className="text-xs mt-1" style={{ color: "var(--ink-soft)" }}>&hellip;and {c.blanks.length - 8} more.</p>}
                      </div>
                    )}
                  </div>
                </div>
              ))}
            </div>

            {unansweredRequired.length > 0 && (
              <div className="rounded-2xl p-4 mb-4" style={{ background: "var(--card)", border: "1px solid var(--lamplight)" }}>
                <Eyebrow>Still needed</Eyebrow>
                {unansweredRequired.slice(0, 12).map(({ sec, f }) => (
                  <button
                    key={f.id}
                    onClick={() => jumpTo(sec.id)}
                    className="block w-full text-left text-sm py-1 transition-colors hover:text-[#7FA08C]"
                    style={{ color: "var(--ink-soft)" }}
                  >
                    &rarr; &sect;{sec.num}: {tok(f.label, answers).length > 80 ? tok(f.label, answers).slice(0, 80) + "…" : tok(f.label, answers)}
                  </button>
                ))}
                {unansweredRequired.length > 12 && (
                  <p className="text-xs mt-2" style={{ color: "var(--ink-soft)" }}>&hellip;and {unansweredRequired.length - 12} more.</p>
                )}
              </div>
            )}

            <button onClick={() => setMode("family")} className="w-full rounded-2xl p-4 mb-4 text-left transition-all active:scale-[0.99]" style={{ background: "rgba(127,160,140,0.14)", border: "1px solid var(--moss)" }}>
              <Eyebrow>For the family</Eyebrow>
              <div className="font-bold text-sm mb-1" style={{ color: "var(--spruce)" }}>
                Open the family copy &rarr;
              </div>
              <p className="text-xs" style={{ color: "var(--ink-soft)" }}>
                The same plan in plain language, ready to print for the fridge and photograph for a phone.
              </p>
            </button>

            {CRISIS_SECTIONS.map((sec) => {
              const visible = sec.fields.filter((f) => isVisible(f, answers) && f.type !== "note");
              const answered = visible.filter((f) => formatAnswer(f, answers) !== null);
              if (answered.length === 0) return null;
              let lastGroup = null;
              return (
                <div key={sec.id} className="rounded-2xl p-4 mb-4" style={{ background: "var(--card)", border: "1px solid var(--mist)" }}>
                  <div className="flex items-baseline justify-between gap-2">
                    <Eyebrow>Section {sec.num} &mdash; {tok(sec.title, answers)}</Eyebrow>
                    {sec.cfcrPage && <span className="text-xs flex-shrink-0" style={{ color: "var(--ink-soft)" }}>CFCR p.{sec.cfcrPage}</span>}
                  </div>
                  {answered.map((f, i) => {
                    const a = formatAnswer(f, answers);
                    const showGroup = f.group && f.group !== lastGroup;
                    if (f.group) lastGroup = f.group;
                    return (
                      <React.Fragment key={f.id}>
                        {showGroup && <div className="text-xs font-bold uppercase tracking-wider mt-4 mb-1" style={{ color: "var(--lamplight-deep)" }}>{tok(f.group, answers)}</div>}
                        <div className="py-3" style={i < answered.length - 1 ? { borderBottom: "1px solid var(--mist)" } : {}}>
                          <div className="text-sm" style={{ color: "var(--ink-soft)" }}>{tok(f.label, answers)}</div>
                          <div className="font-bold mt-1 text-sm whitespace-pre-wrap" style={{ color: "var(--spruce)" }}>{a}</div>
                        </div>
                      </React.Fragment>
                    );
                  })}
                </div>
              );
            })}

            <button onClick={() => copy(summaryText(answers), "record")} className="w-full rounded-2xl py-4 text-lg font-bold mb-3 transition-colors hover:bg-opacity-90" style={{ background: "var(--spruce)", color: "var(--cream-on-dark)" }}>
              {copied === "record" ? "Copied" : "Copy for the record"}
            </button>
            <div className="flex gap-3">
              <button onClick={() => { setSecIdx(0); setMode("fill"); }} className="flex-1 rounded-2xl py-3 text-base font-bold transition-colors hover:bg-[#FAF8F5]" style={{ background: "var(--card)", color: "var(--spruce)", border: "1px solid var(--mist)" }}>
                Keep editing
              </button>
              <button onClick={clearAll} className="flex-1 rounded-2xl py-3 text-base font-bold transition-colors hover:bg-[#FAF8F5]" style={{ background: "var(--card)", color: confirmClear ? "var(--alert)" : "var(--spruce)", border: "1px solid var(--mist)" }}>
                {confirmClear ? "Tap again to erase" : "Start over"}
              </button>
            </div>

            <div className="text-center text-xs mt-8 pt-6" style={{ color: "var(--ink-soft)", borderTop: "1px solid var(--mist)" }}>
              <p>Answers live in this browser only. Nothing is transmitted anywhere.</p>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
