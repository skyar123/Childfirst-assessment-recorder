  <script>
    // LocalStorage Shim for window.storage to persist state in standard browsers
    if (!window.storage) {
      window.storage = {
        get: async (key) => {
          try {
            const value = localStorage.getItem(key);
            return value ? { value } : null;
          } catch (e) {
            console.error("Failed to read from localStorage", e);
            return null;
          }
        },
        set: async (key, value) => {
          try {
            localStorage.setItem(key, value);
          } catch (e) {
            console.error("Failed to write to localStorage", e);
          }
        }
      };
    }

    // ─────────────────────────────────────────────────────────────
    // Helpers
    // ─────────────────────────────────────────────────────────────
    function isVisible(field, answers) {
      if (!field.showIf) return true;
      const cond = field.showIf;
      const v = answers[cond.field];
      if (cond.equals !== undefined) return v === cond.equals;
      if (cond.notEquals !== undefined) return v !== undefined && v !== cond.notEquals;
      if (cond.includes !== undefined) return Array.isArray(v) && v.includes(cond.includes);
      if (cond.inList !== undefined) return cond.inList.includes(v);
      if (cond.hasAny) return Array.isArray(v) && v.length > 0 && !v.includes("None");
      return true;
    }

    function isAnswered(field, answers) {
      const v = answers[field.id];
      if (field.type === "check") return Array.isArray(v) && v.length > 0;
      if (field.type === "area" || field.type === "text") return typeof v === "string" && v.trim().length > 0;
      return v !== undefined && v !== null && v !== "";
    }

    function formatAnswer(field, answers) {
      const v = answers[field.id];
      if (v === undefined || v === null || v === "") return null;
      if (field.type === "check") {
        if (!Array.isArray(v) || v.length === 0) return null;
        const parts = v.map((label) => {
          const d = answers[field.id + "::" + label];
          return d && d.trim() ? label + " — " + d.trim() : label;
        });
        return parts.join("; ");
      }
      if (field.type === "radio") {
        const opt = (field.options || []).find((o) => o.label === v);
        const d = answers[field.id + "::" + v];
        if (opt && opt.detail && d && d.trim()) return v + " — " + d.trim();
        return v;
      }
      return String(v);
    }

    function summaryText(answers) {
      const lines = [
        "CCA & COMPREHENSIVE CHILD FIRST ASSESSMENT",
        "Completed: " + new Date().toLocaleString(),
        "",
      ];
      CCA_SECTIONS.forEach((sec) => {
        const visible = sec.fields.filter((f) => isVisible(f, answers));
        const answered = visible.filter((f) => formatAnswer(f, answers) !== null);
        if (answered.length === 0) return;
        lines.push("=".repeat(60));
        lines.push(sec.num === "i" ? "CHILD INFORMATION" : ("SECTION " + sec.num + ". " + sec.title.toUpperCase()));
        lines.push("=".repeat(60));
        let lastGroup = null;
        visible.forEach((f) => {
          const a = formatAnswer(f, answers);
          if (a === null) return;
          if (f.group && f.group !== lastGroup) {
            lines.push("");
            lines.push("[" + f.group + "]");
            lastGroup = f.group;
          }
          lines.push("");
          lines.push(f.label.replace(/\*$/, "").trim());
          lines.push("  " + a);
        });
        lines.push("");
      });
      return lines.join("\n");
    }

      );

      if (field.type === "text" || field.type === "date") {
        return (
          <div className="mb-8">
            {labelBlock}
            <input
              type={field.type}
              value={typeof value === "string" ? value : ""}
              onChange={(e) => setField(field.id, e.target.value)}

              style={{ background: "rgba(255,255,255,0.07)", color: "var(--cream-on-dark)", border: "1px solid rgba(255,255,255,0.14)", colorScheme: "dark" }}
            />
          </div>
        );
      }

      if (field.type === "select") {
        return (
          <div className="mb-8">
            {labelBlock}
            <select
              value={typeof value === "string" ? value : ""}
              onChange={(e) => setField(field.id, e.target.value)}
              className="w-full rounded-2xl px-4 py-3 text-base focus:outline-none"
              style={{ background: "rgba(255,255,255,0.07)", color: "var(--cream-on-dark)", border: "1px solid rgba(255,255,255,0.14)", colorScheme: "dark" }}
            >
              <option value="">Select…</option>
              {field.options.map((o) => <option key={o} value={o}>{o}</option>)}
            </select>
          </div>
        );
      }

      if (field.type === "area") {
        return (
          <div className="mb-8">
            {labelBlock}
            <textarea
              value={typeof value === "string" ? value : ""}
              onChange={(e) => setField(field.id, e.target.value)}
              rows={field.rows || 4}
              placeholder="Type here…"
              className="w-full rounded-2xl p-4 text-base resize-y focus:outline-none"
              style={{ background: "rgba(255,255,255,0.07)", color: "var(--cream-on-dark)", border: "1px solid rgba(255,255,255,0.14)" }}
            />
          </div>
        );
      }

      if (field.type === "radio") {
        return (
          <div className="mb-8">
            {labelBlock}
            <div className="flex flex-col gap-2">
              {field.options.map((opt) => {
                const selected = value === opt.label;
                return (
                  <div key={opt.label}>
                    <button
                      onClick={() => setField(field.id, opt.label)}
                      className="w-full rounded-2xl py-3 px-4 text-left text-sm font-bold transition-all active:scale-[0.99]"
                      style={selected
                        ? { background: "var(--lamplight)", color: "var(--spruce-deep)", boxShadow: "0 0 0 3px rgba(242,182,83,0.35)" }
                        : { background: "rgba(255,255,255,0.07)", color: "var(--cream-on-dark)", border: "1px solid rgba(255,255,255,0.14)" }}
                    >
                      {opt.label}
                    </button>
                    {selected && opt.detail === "text" && (
                      <input
                        value={answers[field.id + "::" + opt.label] || ""}
                        onChange={(e) => setDetail(field.id, opt.label, e.target.value)}
                        placeholder={opt.detailLabel || "Please describe"}
                        className="w-full rounded-2xl px-4 py-3 mt-2 text-sm focus:outline-none"
                        style={{ background: "rgba(255,255,255,0.07)", color: "var(--cream-on-dark)", border: "1px solid rgba(242,182,83,0.5)" }}
                      />
                    )}
                    {selected && opt.detail === "date" && (
                      <input
                        type="date"
                        value={answers[field.id + "::" + opt.label] || ""}
                        onChange={(e) => setDetail(field.id, opt.label, e.target.value)}
                        aria-label={opt.detailLabel || "Date"}
                        className="w-full rounded-2xl px-4 py-3 mt-2 text-sm focus:outline-none"
                        style={{ background: "rgba(255,255,255,0.07)", color: "var(--cream-on-dark)", border: "1px solid rgba(242,182,83,0.5)", colorScheme: "dark" }}
                      />
                    )}
                    {selected && opt.detail === "area" && (
                      <textarea
                        value={answers[field.id + "::" + opt.label] || ""}
                        onChange={(e) => setDetail(field.id, opt.label, e.target.value)}
                        placeholder={opt.detailLabel || "Please describe"}
                        rows={3}
                        className="w-full rounded-2xl p-4 mt-2 text-sm resize-y focus:outline-none"
                        style={{ background: "rgba(255,255,255,0.07)", color: "var(--cream-on-dark)", border: "1px solid rgba(242,182,83,0.5)" }}
                      />
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      if (field.type === "check") {
        const arr = Array.isArray(value) ? value : [];
        const toggle = (label) => {
          if (arr.includes(label)) setField(field.id, arr.filter((x) => x !== label));
          else setField(field.id, [...arr, label]);
        };
        return (
          <div className="mb-8">
            {labelBlock}
            <div className="flex flex-col gap-2">
              {field.options.map((opt) => {
                const checked = arr.includes(opt.label);
                return (
                  <div key={opt.label}>
                    <button
                      onClick={() => toggle(opt.label)}
                      className="w-full rounded-2xl py-3 px-4 text-left text-sm font-bold transition-all active:scale-[0.99] flex items-start gap-3"
                      style={{
                        ...(checked
                          ? { background: "var(--moss)", color: "var(--spruce-deep)" }
                          : { background: "rgba(255,255,255,0.07)", color: "var(--cream-on-dark)", border: "1px solid rgba(255,255,255,0.14)" }),
                        ...(opt.indent ? { marginLeft: "1.5rem", width: "calc(100% - 1.5rem)" } : {}),
                      }}
                    >
                      <span className="flex-shrink-0 w-5 h-5 rounded-md mt-0.5 flex items-center justify-center text-xs"
                        style={checked
                          ? { background: "var(--spruce-deep)", color: "var(--lamplight)" }
                          : { border: "2px solid rgba(255,255,255,0.35)", color: "transparent" }}
                      >✓</span>
                      <span>{opt.label}</span>
                    </button>
                    {checked && opt.detail === "text" && (
                      <input
                        value={answers[field.id + "::" + opt.label] || ""}
                        onChange={(e) => setDetail(field.id, opt.label, e.target.value)}
                        placeholder={opt.detailLabel || "Please specify"}
                        className="w-full rounded-2xl px-4 py-3 mt-2 text-sm focus:outline-none"
                        style={{ background: "rgba(255,255,255,0.07)", color: "var(--cream-on-dark)", border: "1px solid rgba(127,160,140,0.6)", marginLeft: opt.indent ? "1.5rem" : 0, width: opt.indent ? "calc(100% - 1.5rem)" : "100%" }}
                      />
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      return null;
    }

    // ─────────────────────────────────────────────────────────────
    // Main App
    // ─────────────────────────────────────────────────────────────
    function App() {
      const [mode, setMode] = useState("home"); // home | intro | fill | done
      const [answers, setAnswers] = useState({});
      const [secIdx, setSecIdx] = useState(0);
      const [saveState, setSaveState] = useState("idle");
      const [copied, setCopied] = useState(false);
      const [confirmClear, setConfirmClear] = useState(false);
      const loadedRef = useRef(false);
      const topRef = useRef(null);

      // Load saved answers
      useEffect(() => {
        let alive = true;
        (async () => {
          try {
            if (!window.storage) {
              if (alive) setSaveState("off");
              loadedRef.current = true;
              return;
            }
            const result = await window.storage.get(STORAGE_KEY_CCA);
            if (alive && result && result.value) {
              const parsed = JSON.parse(result.value);
              if (parsed && typeof parsed === "object") setAnswers(parsed);
            }
          } catch (e) {
            // ignore
          } finally {
            loadedRef.current = true;
          }
        })();
        return () => { alive = false; };
      }, []);

      // Autosave answers
      useEffect(() => {
        if (!loadedRef.current) return;
        let cancelled = false;
        const t = setTimeout(async () => {
          try {
            if (!window.storage) return;
            await window.storage.set(STORAGE_KEY_CCA, JSON.stringify(answers));
            if (!cancelled) {
              setSaveState("saved");
              setTimeout(() => { if (!cancelled) setSaveState("idle"); }, 1500);
            }
          } catch (e) {
            if (!cancelled) setSaveState("off");
          }
        }, 600);
        return () => { cancelled = true; clearTimeout(t); };
      }, [answers]);

      const setField = (id, v) => setAnswers((a) => ({ ...a, [id]: v }));
      const setDetail = (id, label, v) => setAnswers((a) => ({ ...a, [id + "::" + label]: v }));

      const answeredAny = Object.keys(answers).length > 0;
      const totalRequired = CCA_SECTIONS.reduce((n, sec) => n + sec.fields.filter((f) => f.req).length, 0);

      const section = CCA_SECTIONS[secIdx];
      const visibleFields = section ? section.fields.filter((f) => isVisible(f, answers)) : [];
      const progress = ((secIdx + 1) / CCA_SECTIONS.length) * 100;

      const sectionCompletion = (sec) => {
        const vis = sec.fields.filter((f) => isVisible(f, answers) && f.req);
        if (vis.length === 0) return 1;
        const done = vis.filter((f) => isAnswered(f, answers)).length;
        return done / vis.length;
      };

      const scrollTop = () => {
        if (topRef.current && topRef.current.scrollIntoView) {
          topRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
        } else {
          window.scrollTo(0, 0);
        }
      };

      const goNext = () => {
        if (secIdx + 1 >= CCA_SECTIONS.length) {
          setMode("done");
        } else {
          setSecIdx(secIdx + 1);
        }
        scrollTop();
      };
      const goBack = () => {
        if (secIdx === 0) setMode("intro");
        else setSecIdx(secIdx - 1);
        scrollTop();
      };

      const clearAll = () => {
        if (!confirmClear) {
          setConfirmClear(true);
          setTimeout(() => setConfirmClear(false), 3000);
          return;
        }
        setConfirmClear(false);
        setAnswers({});
        setSecIdx(0);
        setMode("home");
      };

      const copySummary = async () => {
        const text = summaryText(answers);
        try {
          await navigator.clipboard.writeText(text);
          setCopied(true);
        } catch (e) {
          try {
            const ta = document.createElement("textarea");
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
            setCopied(true);
          } catch (err) {
            setCopied(false);
          }
        }
        setTimeout(() => setCopied(false), 2000);
      };

      // ─── HOME ───
      if (mode === "home") {
        return (
          <div className="cib-body min-h-screen w-full animate-[cibFade_320ms_ease_both]" style={{ background: "var(--paper)", color: "var(--ink)" }}>
            <div className="max-w-md mx-auto px-5 py-10 pb-32">

              <a href="index.html" className="inline-block text-xs font-bold uppercase tracking-wider mb-6 transition-colors hover:text-[#7FA08C]" style={{ color: "var(--ink-soft)" }}>
                &larr; Back to Assessment Recorders
              </a>

              <Eyebrow>Child First Clinical Record</Eyebrow>
              <h1 className="cib-display text-3xl leading-tight mb-2" style={{ color: "var(--spruce)" }}>
                CCA &amp; Comprehensive Child First Assessment
              </h1>
              <p className="text-sm mb-6" style={{ color: "var(--ink-soft)" }}>
                A phone-first digital version of the paper assessment. Work section by section —
                everything autosaves on this device so you can stop and come back.
                {saveState === "saved" && <span style={{ color: "var(--moss)" }}> Saved.</span>}
                {saveState === "off" && <span> Saving is off here.</span>}
              </p>

              <div className="rounded-2xl p-4 mb-6" style={{ background: "var(--card)", border: "1px solid var(--mist)" }}>
                <Eyebrow>Before you begin</Eyebrow>
                <p className="text-xs mb-2" style={{ color: "var(--ink-soft)" }}>
                  Fields marked <span style={{ color: "var(--lamplight-deep)" }}>*</span> are always
                  required in CFCR. Additional fields may be required based on data entry. Answers
                  live only in this browser — copy the completed summary into the clinical record
                  when finished.
                </p>
                <p className="text-xs" style={{ color: "var(--ink-soft)" }}>
                  <strong>{CCA_SECTIONS.length - 1} sections</strong> plus child information · {totalRequired} required fields.
                </p>
              </div>

              <Eyebrow>Sections</Eyebrow>
              <div className="flex flex-col gap-2 mb-8">
                {CCA_SECTIONS.map((sec, i) => {
                  const c = sectionCompletion(sec);
                  return (
                    <button
                      key={sec.id}
                      onClick={() => { setSecIdx(i); setMode("fill"); }}
                      className="w-full rounded-2xl p-4 text-left transition-all active:scale-[0.99] hover:border-[#7FA08C]"
                      style={{ background: "var(--card)", border: "1px solid var(--mist)" }}
                    >
                      <div className="flex items-center justify-between gap-3">
                        <div className="flex items-center gap-3">
                          <span className="cib-display text-lg w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0"
                            style={{ background: c >= 1 ? "var(--moss)" : "var(--mist)", color: c >= 1 ? "var(--spruce-deep)" : "var(--spruce)" }}>
                            {sec.num}
                          </span>
                          <div>
                            <div className="font-bold text-sm" style={{ color: "var(--spruce)" }}>{sec.title}</div>
                            <div className="text-xs" style={{ color: "var(--ink-soft)" }}>{sec.blurb}</div>
                          </div>
                        </div>
                        {c >= 1
                          ? <span className="text-xs font-bold flex-shrink-0" style={{ color: "var(--moss)" }}>✓</span>
                          : c > 0
                            ? <span className="text-xs font-bold flex-shrink-0" style={{ color: "var(--lamplight-deep)" }}>{Math.round(c * 100)}%</span>
                            : null}
                      </div>
                    </button>
                  );
                })}
              </div>

              <div className="flex gap-3">
                <button
                  onClick={() => { setSecIdx(0); setMode("intro"); }}
                  className="flex-1 rounded-2xl py-4 text-base font-bold transition-transform active:scale-[0.98]"
                  style={{ background: "var(--spruce)", color: "var(--cream-on-dark)" }}
                >
                  {answeredAny ? "Resume" : "Start"} assessment
                </button>
                {answeredAny && (
                  <button
                    onClick={() => setMode("done")}
                    className="flex-1 rounded-2xl py-4 text-base font-bold transition-colors hover:bg-[#FAF8F5]"
                    style={{ background: "var(--card)", color: "var(--spruce)", border: "1px solid var(--mist)" }}
                  >
                    Review &amp; copy
                  </button>
                )}
              </div>
              {answeredAny && (
                <button onClick={clearAll} className="w-full py-3 mt-2 text-sm transition-colors" style={{ color: confirmClear ? "var(--alert)" : "var(--ink-soft)" }}>
                  {confirmClear ? "Tap again to erase all answers" : "Clear all answers"}
                </button>
              )}

              <div className="text-center text-xs mt-8 pt-6" style={{ color: "var(--ink-soft)", borderTop: "1px solid var(--mist)" }}>
                <p>
                  Digital recording convenience only. Clinical interpretation and CFCR data entry
                  remain the responsibility of the assessing clinician.
                </p>
              </div>
            </div>
          </div>
        );
      }

      // ─── INTRO / TITLE CARD ───
      if (mode === "intro") {
        return (
          <AssessmentIntro
            eyebrow="Child First Clinical Record"
            title="CCA &amp; Comprehensive Child First Assessment"
            subtitle="Comprehensive Clinical Assessment"
            purpose="This assessment gathers the full Child First clinical picture in one pass — risk and protective factors, mental status, developmental and health history, formulation, and treatment recommendations — so that the record, the formulation, and the treatment plan all rest on the same evidence."
            meta={[(CCA_SECTIONS.length - 1) + " sections plus child information", totalRequired + " required fields", "Autosaves on this device"]}
            accent="var(--lamplight)"
            beginLabel={answeredAny ? "Continue" : "Begin"}
            backLabel="Back to sections"
            onBegin={() => setMode("fill")}
            onBack={() => setMode("home")}
          />
        );
      }

      // ─── FILL (section wizard, dark) ───
      if (mode === "fill") {
        let lastGroup = null;
        return (
          <div ref={topRef} className="cib-body min-h-screen w-full flex flex-col animate-[cibFade_320ms_ease_both]" style={{ background: "var(--spruce-deep)", color: "var(--cream-on-dark)" }}>
            <div className="max-w-md mx-auto w-full px-5 pt-6 pb-10 flex flex-col flex-1">
              <div className="mb-6">
                <div className="flex justify-between items-baseline mb-2">
                  <button onClick={() => setMode("home")} className="text-xs font-bold uppercase tracking-wider" style={{ color: "var(--soft-on-dark)" }}>
                    &larr; Sections
                  </button>
                  <span className="text-sm" style={{ color: "var(--soft-on-dark)" }}>
                    {section.num === "i" ? "Info" : "Section " + section.num} · {secIdx + 1} of {CCA_SECTIONS.length}
                    {saveState === "saved" && <span style={{ color: "var(--moss)" }}> · Saved</span>}
                  </span>
                </div>
                <div className="h-1 rounded-full w-full" style={{ background: "rgba(255,255,255,0.12)" }}>
                  <div className="h-1 rounded-full" style={{ width: progress + "%", background: "var(--lamplight)", transition: "width 300ms ease" }} />
                </div>
              </div>

              <div key={section.id} className="cib-fade flex-1">
                <Eyebrow dark>{section.num === "i" ? "Child Information" : "Section " + section.num}</Eyebrow>
                <h1 className="cib-display text-2xl leading-snug mb-2" style={{ color: "var(--cream-on-dark)" }}>
                  {section.title}
                </h1>
                <p className="text-sm mb-8" style={{ color: "var(--soft-on-dark)" }}>{section.blurb}</p>

                {visibleFields.map((f) => {
                  const showGroup = f.group && f.group !== lastGroup;
                  if (f.group) lastGroup = f.group;
                  return (
                    <React.Fragment key={f.id}>
                      {showGroup && (
                        <div className="mt-2 mb-4 pt-4" style={{ borderTop: "1px solid rgba(255,255,255,0.14)" }}>
                          <Eyebrow dark>{f.group}</Eyebrow>
                        </div>
                      )}
                      <FieldView field={f} answers={answers} setField={setField} setDetail={setDetail} />
                    </React.Fragment>
                  );
                })}
              </div>

              <div className="flex gap-3 mt-4">
                <button onClick={goBack} className="rounded-2xl py-4 px-6 text-base font-bold transition-colors hover:bg-white/10" style={{ background: "rgba(255,255,255,0.07)", color: "var(--cream-on-dark)", border: "1px solid rgba(255,255,255,0.14)" }}>
                  Back
                </button>
                <button onClick={goNext} className="flex-1 rounded-2xl py-4 text-base font-bold transition-colors hover:bg-opacity-90" style={{ background: "var(--cream-on-dark)", color: "var(--spruce-deep)" }}>
                  {secIdx + 1 >= CCA_SECTIONS.length ? "Finish & review" : "Next section"}
                </button>
              </div>
            </div>
          </div>
        );
      }

      // ─── DONE / REVIEW ───
      const unansweredRequired = [];
      CCA_SECTIONS.forEach((sec) => {
        sec.fields.forEach((f) => {
          if (f.req && isVisible(f, answers) && !isAnswered(f, answers)) {
            unansweredRequired.push({ sec, f });
          }
        });
      });

      return (
        <div className="cib-body min-h-screen w-full animate-[cibFade_320ms_ease_both]" style={{ background: "var(--paper)", color: "var(--ink)" }}>
          <div className="max-w-md mx-auto px-4 py-8 cib-fade">
            <button onClick={() => setMode("home")} className="text-xs font-bold uppercase tracking-wider mb-4 transition-colors hover:text-[#7FA08C]" style={{ color: "var(--ink-soft)" }}>
              &larr; Back to sections
            </button>
            <Eyebrow>Review</Eyebrow>
            <h1 className="cib-display text-3xl mb-2" style={{ color: "var(--spruce)" }}>Assessment summary</h1>
            <p className="text-sm mb-6" style={{ color: "var(--ink-soft)" }}>
              {answers.child_name ? <span><strong>{answers.child_name}</strong> · </span> : null}
              {unansweredRequired.length === 0
                ? "All required fields are answered."
                : unansweredRequired.length + " required field" + (unansweredRequired.length === 1 ? "" : "s") + " still blank (marked *)."}
              {" "}Copy the summary before you close.
            </p>

            {unansweredRequired.length > 0 && (
              <div className="rounded-2xl p-4 mb-4" style={{ background: "var(--card)", border: "1px solid var(--lamplight)" }}>
                <Eyebrow>Still needed</Eyebrow>
                {unansweredRequired.slice(0, 12).map(({ sec, f }) => (
                  <button
                    key={f.id}
                    onClick={() => { setSecIdx(CCA_SECTIONS.findIndex((s) => s.id === sec.id)); setMode("fill"); }}
                    className="block w-full text-left text-sm py-1 transition-colors hover:text-[#7FA08C]"
                    style={{ color: "var(--ink-soft)" }}
                  >
                    → {sec.num === "i" ? "Info" : "§" + sec.num}: {f.label.length > 80 ? f.label.slice(0, 80) + "…" : f.label}
                  </button>
                ))}
                {unansweredRequired.length > 12 && (
                  <p className="text-xs mt-2" style={{ color: "var(--ink-soft)" }}>…and {unansweredRequired.length - 12} more.</p>
                )}
              </div>
            )}

            {CCA_SECTIONS.map((sec) => {
              const visible = sec.fields.filter((f) => isVisible(f, answers));
              const answered = visible.filter((f) => formatAnswer(f, answers) !== null);
              if (answered.length === 0) return null;
              let lastGroup = null;
              return (
                <div key={sec.id} className="rounded-2xl p-4 mb-4" style={{ background: "var(--card)", border: "1px solid var(--mist)" }}>
                  <Eyebrow>{sec.num === "i" ? "Child Information" : "Section " + sec.num + " — " + sec.title}</Eyebrow>
                  {answered.map((f, i) => {
                    const a = formatAnswer(f, answers);
                    const showGroup = f.group && f.group !== lastGroup;
                    if (f.group) lastGroup = f.group;
                    return (
                      <React.Fragment key={f.id}>
                        {showGroup && <div className="text-xs font-bold uppercase tracking-wider mt-4 mb-1" style={{ color: "var(--lamplight-deep)" }}>{f.group}</div>}
                        <div className="py-3" style={i < answered.length - 1 ? { borderBottom: "1px solid var(--mist)" } : {}}>
                          <div className="text-sm" style={{ color: "var(--ink-soft)" }}>{f.label}</div>
                          <div className="font-bold mt-1 text-sm whitespace-pre-wrap" style={{ color: "var(--spruce)" }}>{a}</div>
                        </div>
                      </React.Fragment>
                    );
                  })}
                </div>
              );
            })}

            <button onClick={copySummary} className="w-full rounded-2xl py-4 text-lg font-bold mb-3 transition-colors hover:bg-opacity-90" style={{ background: "var(--spruce)", color: "var(--cream-on-dark)" }}>
              {copied ? "Copied" : "Copy summary"}
            </button>
            <div className="flex gap-3">
              <button onClick={() => { setSecIdx(0); setMode("fill"); }} className="flex-1 rounded-2xl py-3 text-base font-bold transition-colors hover:bg-[#FAF8F5]" style={{ background: "var(--card)", color: "var(--spruce)", border: "1px solid var(--mist)" }}>
                Keep editing
              </button>
              <button onClick={clearAll} className="flex-1 rounded-2xl py-3 text-base font-bold transition-colors hover:bg-[#FAF8F5]" style={{ background: "var(--card)", color: confirmClear ? "var(--alert)" : "var(--spruce)", border: "1px solid var(--mist)" }}>
                {confirmClear ? "Tap again to erase" : "Start over"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
