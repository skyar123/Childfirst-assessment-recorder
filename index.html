      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }

  <script>
    // LocalStorage Shim for window.storage to persist state in standard browsers
    if (!window.storage) {
      window.storage = {
        get: async (key) => {
          try {
            const value = localStorage.getItem(key);
            return value ? { value } : null;
          } catch (e) {
            console.error("Failed to read from localStorage", e);
            return null;
          }
        },
        set: async (key, value) => {
          try {
            localStorage.setItem(key, value);
          } catch (e) {
            console.error("Failed to write to localStorage", e);
          }
        }
      };
    }
  </script>

    const BITSEA_CUTS = [
      { min: 12, max: 17, problem: { girls: 13, boys: 13 }, competence: { girls: 12, boys: 12 } },
      { min: 18, max: 23, problem: { girls: 13, boys: 15 }, competence: { girls: 14, boys: 14 } },
      { min: 24, max: 29, problem: { girls: 14, boys: 15 }, competence: { girls: 15, boys: 14 } },

    const BITSEA_MAX_MISSING_PROBLEM = 5;
    const BITSEA_MAX_MISSING_COMPETENCE = 2;

    function bitseaCuts(ageMonths, sex) {
      if (!ageMonths || !sex) return null;
      const band = BITSEA_CUTS.filter((b) => ageMonths >= b.min && ageMonths <= b.max)[0];
      if (!band) return null;
      const key = sex === "F" ? "girls" : "boys";
      return { band, problem: band.problem[key], competence: band.competence[key] };

    const TONE_COLOR = { calm: "var(--moss-deep)", watch: "var(--lamplight-deep)", alert: "var(--rose)" };

    const answered = (answers, q) => answers[q.id] !== undefined && answers[q.id] !== null && answers[q.id] !== "skip";

    // ── PSI-4-SF ──
    // Strongly Agree scores highest; two items carry their own choice scores.
    function scorePSI(form, answers) {
      const askable = form.questions.filter((q) => q.text.trim().length > 0);
      const itemScore = (q) => {
        const v = answers[q.id];
        if (v === undefined || v === null || v === "skip") return null;
        if (q.type === "choice" && Array.isArray(q.choices)) return q.choices[v] ? q.choices[v].score : null;
        if (typeof v === "number") {
          const start = typeof form.scaleStart === "number" ? form.scaleStart : 1;
          return (form.scale.length - 1 - v) + start;
        }
        return null;
      };
      const cats = {};
      askable.forEach((q) => {
        if (!q.category) return;
        const s = itemScore(q);
        if (s === null) return;
        if (!cats[q.category]) cats[q.category] = { sum: 0, n: 0, max: 0 };
        cats[q.category].sum += s;
        cats[q.category].n += 1;
        cats[q.category].max += 5;
      });
      const keys = Object.keys(cats);
      let sum = 0, max = 0;
      keys.forEach((k) => { sum += cats[k].sum; max += cats[k].max; });
      return {
        itemScore,
        headline: keys.length ? {
          label: "Total Stress (raw)", value: sum, max,
          verdict: { label: "Raw score", tone: "calm", note: "Convert to a percentile using the official PSI-4-SF profile before interpreting. This tool does not norm." },
        } : null,
        rows: keys.map((k) => ({ label: k, value: cats[k].sum, max: cats[k].max, tone: "calm" })),
        alerts: [],
        followUps: [],

    }

    // ── PKBS-2 ──
    function scorePKBS(form, answers) {
      const askable = form.questions.filter((q) => q.text.trim().length > 0);
      const itemScore = (q) => {
        const v = answers[q.id];
        if (v === undefined || v === null || v === "skip" || typeof v !== "number") return null;
        return v + (typeof form.scaleStart === "number" ? form.scaleStart : 0);
      };
      const SOCIAL = ["Social Cooperation", "Social Interaction", "Social Independence"];
      const PROBLEM = ["Externalizing Problems", "Internalizing Problems"];
      const cats = {};
      askable.forEach((q) => {
        if (!q.category) return;
        const s = itemScore(q);
        if (s === null) return;
        if (!cats[q.category]) cats[q.category] = { sum: 0, n: 0, max: 0 };
        cats[q.category].sum += s;
        cats[q.category].n += 1;
        cats[q.category].max += (form.scale.length - 1) + (form.scaleStart || 0);
      });
      const rows = [];
      const composite = (names, label) => {
        const present = names.filter((k) => cats[k]);
        if (!present.length) return null;
        let sum = 0, max = 0;
        present.forEach((k) => { sum += cats[k].sum; max += cats[k].max; });
        return { label, value: sum, max, tone: "calm", emphasis: true };
      };
      SOCIAL.forEach((k) => { if (cats[k]) rows.push({ label: k, value: cats[k].sum, max: cats[k].max, tone: "calm" }); });
      const soc = composite(SOCIAL, "Social Skills Composite");
      if (soc) rows.push(soc);
      PROBLEM.forEach((k) => { if (cats[k]) rows.push({ label: k, value: cats[k].sum, max: cats[k].max, tone: "calm" }); });
      const prob = composite(PROBLEM, "Problem Behavior Composite");
      if (prob) rows.push(prob);
      Object.keys(cats).forEach((k) => {
        if (!SOCIAL.includes(k) && !PROBLEM.includes(k)) rows.push({ label: k, value: cats[k].sum, max: cats[k].max, tone: "calm" });
      });
      return {
        itemScore,
        headline: null,
        rows,
        alerts: rows.length ? [{
          title: "Raw scores only", tone: "calm",
          body: "Convert to standard scores and percentiles using the official PKBS-2 manual. Home-based and school-based raters use different tables.",
        }] : [],
        followUps: [],
      };
    }

    // ── CESD-R ──
    // The five response options score 0/1/2/3/3 per the Child First score sheet.
    function scoreCESDR(form, answers) {
      const askable = form.questions.filter((q) => q.text.trim().length > 0);
      const scaleScores = Array.isArray(form.scaleScores) ? form.scaleScores : [];
      const itemMax = scaleScores.length ? Math.max.apply(null, scaleScores) : 3;
      const itemScore = (q) => {
        const v = answers[q.id];
        if (v === undefined || v === null || v === "skip" || typeof v !== "number") return null;
        const s = scaleScores[v];
        return typeof s === "number" ? s : null;
      };
      const cats = {};
      askable.forEach((q) => {
        if (!q.category) return;
        const s = itemScore(q);
        if (s === null) return;
        if (!cats[q.category]) cats[q.category] = { sum: 0, n: 0, max: 0 };
        cats[q.category].sum += s;
        cats[q.category].n += 1;
        cats[q.category].max += itemMax;
      });
      const ordered = [];
      CESDR_DOMAIN_ORDER.forEach((k) => { if (cats[k]) ordered.push(k); });
      Object.keys(cats).forEach((k) => { if (!ordered.includes(k)) ordered.push(k); });
      let sum = 0, max = 0;
      ordered.forEach((k) => { sum += cats[k].sum; max += cats[k].max; });

      const si = askable.some((q) => q.category === "Suicidal Ideation" && (itemScore(q) || 0) > 0);
      let verdict;
      if (sum > CESDR_CLINICAL_CUTOFF) verdict = { label: "At or above clinical threshold", tone: "alert", note: "A total above " + CESDR_CLINICAL_CUTOFF + " meets the clinical threshold on this screener. Follow up with a full diagnostic assessment." };
      else if (sum > CESDR_FURTHER_CUTOFF) verdict = { label: "Further investigation warranted", tone: "watch", note: "A total above " + CESDR_FURTHER_CUTOFF + " warrants further investigation, though it sits below the clinical threshold of " + CESDR_CLINICAL_CUTOFF + "." };
      else verdict = { label: "Below screening cutoffs", tone: "calm", note: "A total of " + CESDR_FURTHER_CUTOFF + " or below sits under both cutoffs. Clinical judgment still governs." };

      return {
        itemScore,
        headline: ordered.length ? { label: "Total Score", value: sum, max, verdict } : null,
        rows: ordered.map((k) => ({ label: k, value: cats[k].sum, max: cats[k].max, tone: k === "Suicidal Ideation" && si ? "alert" : "calm" })),
        alerts: si ? [{
          title: "Suicidal ideation endorsed", tone: "alert",
          body: "Item 14 and/or 15 was endorsed. Any endorsement on either item requires further assessment now, regardless of the total score. Follow your program's safety protocol.",
        }] : [],
        followUps: [],
      };
    }

    // ── Parent Questionnaire ──
    // Each lettered section earns at most 1 point, by its own rule. Positive
    // screen = 3+ points, or any point in a starred (auto-positive) section.
    // Clinical concern alone is also a positive screen — the clinician's call.
    function scorePQ(form, answers) {
      const val = (id) => {
        const v = answers[id];
        if (v === 0) return "Yes";
        if (v === 1) return "No";
        return null; // unanswered or skipped
      };
      const rows = [];
      const autoHits = [];
      let total = 0;
      PQ_SECTIONS.forEach((sec) => {
        const items = form.questions.filter((q) => q.category === sec.name);
        const vals = items.map((q) => val(q.id));
        const anyAnswered = vals.some((v) => v !== null);
        let point = 0;
        if (sec.rule === "anyYes") point = vals.some((v) => v === "Yes") ? 1 : 0;
        else if (sec.rule === "allNo") point = (vals.length > 0 && vals.every((v) => v === "No")) ? 1 : 0;
        else if (sec.rule === "yes") point = vals[0] === "Yes" ? 1 : 0;
        else if (sec.rule === "no") point = vals[0] === "No" ? 1 : 0;
        total += point;
        if (point && sec.auto) autoHits.push(sec);
        rows.push({
          label: sec.letter + ". " + sec.name + (sec.auto ? " ★" : ""),
          value: point, max: 1,
          tone: point ? (sec.auto ? "alert" : "watch") : "calm",
          muted: !anyAnswered,
        });
      });
      const positive = total >= PQ_POSITIVE_CUTOFF || autoHits.length > 0;
      const verdict = positive
        ? {
            label: "Positive screen", tone: autoHits.length ? "alert" : "watch",
            note: autoHits.length
              ? "An automatic-positive section was endorsed (" + autoHits.map((s) => s.letter).join(", ") + "), which is a positive screen on its own regardless of the total."
              : "Three or more risk factors is a positive screen.",
          }
        : {
            label: "Below the cut-point", tone: "calm",
            note: "Fewer than " + PQ_POSITIVE_CUTOFF + " risk factors and no automatic positive. Any clinical concern is a positive screen regardless of the score.",
          };
      return {
        itemScore: (q) => (val(q.id) === "Yes" ? 1 : val(q.id) === "No" ? 0 : null),
        headline: { label: "Risk factors", value: total, max: PQ_SECTIONS.length, verdict },
        rows,
        alerts: autoHits.map((s) => ({
          title: "Automatic positive — " + s.letter + ". " + s.name, tone: "alert",
          body: (PQ_FOLLOW_UP[s.letter] || "Explore with the caregiver before the visit ends."),
        })),
        followUps: rows
          .filter((r) => r.value > 0)
          .map((r) => {
            const letter = r.label.slice(0, 1);
            return { letter, label: r.label.replace(" ★", ""), prompt: PQ_FOLLOW_UP[letter] || "" };
          }),
      };
    }

    // ── M-CHAT-R ──
    // NO indicates risk on every item except 2, 5 and 12, where YES does.
    function scoreMCHAT(form, answers) {
      const itemScore = (q) => {
        const v = answers[q.id];
        if (v === undefined || v === null || v === "skip") return null;
        const said = v === 0 ? "Yes" : "No";
        return said === q.risk ? 1 : 0;
      };
      let total = 0;
      const failed = [];
      form.questions.forEach((q, i) => {
        const s = itemScore(q);
        if (s === 1) { total += 1; failed.push(i + 1); }
      });
      let verdict;
      if (total >= MCHAT_HIGH_RISK_MIN) verdict = { label: "High risk", tone: "alert", note: "A total of " + MCHAT_HIGH_RISK_MIN + "–20. It is acceptable to bypass the Follow-Up and refer immediately for diagnostic evaluation and an early-intervention eligibility evaluation." };
      else if (total >= MCHAT_MEDIUM_RISK_MIN) verdict = { label: "Medium risk", tone: "watch", note: "A total of " + MCHAT_MEDIUM_RISK_MIN + "–7. Administer the M-CHAT-R/F Follow-Up interview on the failed items only. If the Follow-Up score stays at 2 or higher the child has screened positive and should be referred." };
      else verdict = { label: "Low risk", tone: "calm", note: "A total of 0–2. No further action unless surveillance indicates risk. If the child is younger than 24 months, screen again after the second birthday." };
      return {
        itemScore,
        headline: { label: "Risk items", value: total, max: form.questions.length, verdict },
        rows: [],
        alerts: failed.length ? [{
          title: "Items indicating risk", tone: total >= MCHAT_MEDIUM_RISK_MIN ? "watch" : "calm",
          body: "Item" + (failed.length > 1 ? "s " : " ") + failed.join(", ") + ". "
            + (total >= MCHAT_MEDIUM_RISK_MIN && total < MCHAT_HIGH_RISK_MIN
              ? "Administer the Follow-Up interview for these items only."
              : "Refer regardless of score if you or the caregiver have concerns about ASD."),
        }] : [],
        followUps: [],
      };
    }

    // ── BITSEA ──
    // Problem and Competence totals, compared against age-band and sex cut
    // scores. Items answered "N" (no contact with other children) count as
    // missing, not as zero. The manual declines to compute a total when more
    // than 5 Problem or 2 Competence items are missing.
    function scoreBITSEA(form, answers, meta) {
      const raw = (q) => {
        const v = answers[q.id];
        if (v === undefined || v === null || v === "skip" || v === "N") return null;
        return typeof v === "number" ? v : null;
      };
      const tally = (bank) => {
        const items = form.questions.filter((q) => q.bank === bank);
        let sum = 0, missing = 0, max = 0;
        items.forEach((q) => {
          const s = raw(q);
          max += 2;
          if (s === null) missing += 1; else sum += s;
        });
        return { sum, missing, max, n: items.length };
      };

      const prob = tally("problem");
      const comp = tally("competence");
      const probOK = prob.missing <= BITSEA_MAX_MISSING_PROBLEM;
      const compOK = comp.missing <= BITSEA_MAX_MISSING_COMPETENCE;

      const ageMonths = meta && meta.ageMonths ? parseInt(meta.ageMonths, 10) : null;
      const sex = meta && meta.sex ? meta.sex : null;
      const cuts = bitseaCuts(ageMonths, sex);

      const rows = [
        { label: "Problem Total", value: probOK ? prob.sum : "—", max: prob.max, tone: probOK && cuts && prob.sum >= cuts.problem ? "alert" : "calm", emphasis: true },
        { label: "Competence Total", value: compOK ? comp.sum : "—", max: comp.max, tone: compOK && cuts && comp.sum <= cuts.competence ? "alert" : "calm", emphasis: true },
      ];

      // Caregiver worry ratings sit outside both totals.
      form.questions.filter((q) => q.bank === "worry").forEach((q, i) => {
        const v = answers[q.id];
        rows.push({
          label: (i === 0 ? "Worry — behavior/emotions" : "Worry — language"),
          value: typeof v === "number" ? v + 1 : "—", max: 4, tone: typeof v === "number" && v >= 2 ? "watch" : "calm",
        });
      });

      const alerts = [];
      if (!probOK) alerts.push({ title: "Problem Total not calculated", tone: "watch", body: prob.missing + " Problem items are missing. The manual does not compute a Problem raw score when more than " + BITSEA_MAX_MISSING_PROBLEM + " are missing." });
      if (!compOK) alerts.push({ title: "Competence Total not calculated", tone: "watch", body: comp.missing + " Competence items are missing. The manual does not compute a Competence raw score when more than " + BITSEA_MAX_MISSING_COMPETENCE + " are missing." });

      if (!cuts) {
        alerts.push({
          title: ageMonths && (ageMonths < 12 || ageMonths > 35) ? "Outside the published norms" : "Age and sex needed for cut scores",
          tone: "watch",
          body: ageMonths && (ageMonths < 12 || ageMonths > 35)
            ? "Published BITSEA norms cover 12–35 months; this child is " + ageMonths + " months. Child First uses author-supplied norms up to 48 months for follow-up, which are not built in here — score against the manual."
            : "Enter the child's adjusted age in months and sex on the setup screen to compare these totals against the cut scores.",
        });
      } else {
        if (probOK && prob.sum >= cuts.problem) alerts.push({ title: "Possible Problem", tone: "alert", body: "Problem Total " + prob.sum + " is at or above the cut score of " + cuts.problem + " for " + (sex === "F" ? "girls" : "boys") + " aged " + cuts.band.min + "–" + cuts.band.max + " months (75th percentile)." });
        if (compOK && comp.sum <= cuts.competence) alerts.push({ title: "Possible Deficit / Delay", tone: "alert", body: "Competence Total " + comp.sum + " is at or below the cut score of " + cuts.competence + " for " + (sex === "F" ? "girls" : "boys") + " aged " + cuts.band.min + "–" + cuts.band.max + " months (15th percentile)." });
      }

      // Red-flag items: presence on Problem items, absence on Competence items.
      const flags = [];
      form.questions.filter((q) => q.flag).forEach((q, i) => {
        const s = raw(q);
        if (s === null) return;
        const num = form.questions.indexOf(q) + 1;
        if (q.bank === "problem" && s > 0) flags.push(num);
        if (q.bank === "competence" && s === 0) flags.push(num);
      });
      if (flags.length >= 3) {
        alerts.push({
          title: "Autism-related items endorsed (" + flags.length + ")",
          tone: "watch",
          body: "Item" + (flags.length > 1 ? "s " : " ") + flags.join(", ") + ". The presence of several Problem behaviours and/or the absence of several Competence behaviours on these items may be associated with autism spectrum disorders. Consider pairing with the M-CHAT-R.",
        });
      }

      return {
        itemScore: (q) => (q.bank === "worry" ? null : raw(q)),
        headline: {
          label: "Problem Total", value: probOK ? prob.sum : 0, max: prob.max,
          verdict: !cuts
            ? { label: "No cut score", tone: "calm", note: "Enter adjusted age in months and sex on the setup screen to compare against the published cut scores." }
            : (probOK && prob.sum >= cuts.problem)
              ? { label: "Possible Problem", tone: "alert", note: "At or above the cut score of " + cuts.problem + ". Competence Total is shown below and is judged separately." }
              : { label: "Below the cut score", tone: "calm", note: "Below the Problem cut score of " + cuts.problem + ". Check the Competence Total separately — a low Competence score is its own finding." },
        },
        rows,
        alerts,
        followUps: [],
      };
    }

    // Condensed follow-up prompts from the Child First Brief Guide to the PQ.
    // These are conversation openers for the clinician, never read aloud as a script.
    const PQ_FOLLOW_UP = {
      A: "What are the specific concerns? When were you first worried, and why? Is your child developing differently from what you expected, or from other children? Any evaluation in the past?",

      E: "Where are you living now, and how long? Is it stable? How many people are in the home? How many moves this year? When was there no place to live, and what did you do?",

      K: "When, and for how long? Did you have a child then, and who cared for them? What was it like when you were together again? How did your child react to the separation and the return?",
      L: "When were you involved, and for how long? Are you still involved now? What brought child welfare into your life? Was your child ever removed, and who did they live with? How often could you see them? What was the return like for both of you?",
      M: "In what ways were you physically harmed — did you ever need medical attention? How often did adults fight at home? Were police ever involved? Were you left alone for long periods? What do you remember about child welfare in your life as a child?",
      N: "Have you or your children ever gone to bed hungry? Have you used a food pantry? Have you had to choose between food and heat or rent? Do you have WIC or SNAP? Would you like help accessing food resources?",
    };

    // ─────────────────────────────────────────────────────────────
    // Instrument registry

    const instrumentById = (id) => INSTRUMENTS.filter((x) => x.id === id)[0] || null;

    // ─────────────────────────────────────────────────────────────
    // Confetti — a short, contained burst in the app's own palette.
    // Celebratory but not a party: muted colors, gravity, ~1.6s, then gone.
    // Skipped entirely when the viewer prefers reduced motion.
    // ─────────────────────────────────────────────────────────────
    function Confetti({ run }) {
      const canvasRef = useRef(null);
      useEffect(() => {
        if (!run) return;
        let reduced = false;
        try {
          reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        } catch (e) { /* treat as not reduced */ }
        if (reduced) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        if (!ctx) return;

        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = canvas.clientWidth, h = canvas.clientHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.scale(dpr, dpr);

        const COLORS = ["#F2B653", "#7FA08C", "#4F7360", "#D99A2B", "#A8BBAF", "#6B5B8C"];
        const pieces = [];
        const count = Math.min(70, Math.round(w / 6));
        for (let i = 0; i < count; i++) {
          pieces.push({
            x: w / 2 + (Math.random() - 0.5) * w * 0.5,
            y: h * 0.34 + (Math.random() - 0.5) * 30,
            vx: (Math.random() - 0.5) * 4.4,
            vy: -3.2 - Math.random() * 4.2,
            size: 4 + Math.random() * 5,
            rot: Math.random() * Math.PI,
            vr: (Math.random() - 0.5) * 0.22,
            color: COLORS[i % COLORS.length],
          });
        }

        let raf = 0;
        const start = performance.now();
        const DURATION = 1700;
        const tick = (now) => {
          const elapsed = now - start;
          ctx.clearRect(0, 0, w, h);
          const fade = elapsed > DURATION - 500 ? Math.max(0, (DURATION - elapsed) / 500) : 1;
          pieces.forEach((p) => {
            p.vy += 0.13;          // gravity
            p.vx *= 0.995;         // drag
            p.x += p.vx;
            p.y += p.vy;
            p.rot += p.vr;
            ctx.save();
            ctx.globalAlpha = fade;
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.62);
            ctx.restore();
          });
          if (elapsed < DURATION) raf = requestAnimationFrame(tick);
          else ctx.clearRect(0, 0, w, h);
        };
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);
      }, [run]);

      return (
        <canvas
          ref={canvasRef}
          aria-hidden="true"
          className="pointer-events-none absolute inset-0 w-full h-full"
          style={{ zIndex: 1 }}
        />
      );
    }

    // ─────────────────────────────────────────────────────────────
    // Title card — one sentence on what this covers and why, shown before
    // the first question so whoever is holding the phone knows what they
    // are about to be asked.
    // ─────────────────────────────────────────────────────────────
    function AssessmentIntro({ eyebrow, title, subtitle, purpose, note, meta, accent, beginLabel, backLabel, onBegin, onBack }) {
      return (
        <div className="cib-body min-h-screen w-full flex flex-col cib-fade" style={{ background: "var(--spruce-deep)", color: "var(--cream-on-dark)" }}>
          <div className="max-w-md mx-auto w-full px-5 pt-6 pb-8 safe-bottom flex flex-col flex-1">

            <button onClick={onBack} className="self-start text-xs font-bold uppercase tracking-wider transition-colors hover:text-white" style={{ color: "var(--soft-on-dark)" }}>
              &larr; {backLabel || "Back"}
            </button>

            <div className="flex-1 flex flex-col justify-center py-8">
              <div className="rounded-3xl p-7" style={{ background: "rgba(255,255,255,0.07)", border: "1px solid rgba(255,255,255,0.14)" }}>
                {eyebrow ? (
                  <div className="text-xs font-bold uppercase tracking-widest mb-3" style={{ color: accent || "var(--lamplight)", letterSpacing: "0.14em" }}>
                    {eyebrow}
                  </div>
                ) : null}
                <h1 className="cib-display text-3xl leading-tight mb-2">{title}</h1>
                {subtitle ? <p className="text-sm" style={{ color: "var(--soft-on-dark)" }}>{subtitle}</p> : null}

                <div className="h-px w-full my-5" style={{ background: "rgba(255,255,255,0.14)" }} />

                <p className="text-base leading-relaxed">{purpose}</p>

                {note ? (
                  <p className="text-sm leading-relaxed mt-4 rounded-2xl p-4" style={{ background: "rgba(242,182,83,0.12)", color: "var(--cream-on-dark)", border: "1px solid rgba(242,182,83,0.25)" }}>
                    {note}
                  </p>
                ) : null}

                {Array.isArray(meta) && meta.length > 0 && (
                  <div className="flex flex-wrap gap-2 mt-6">
                    {meta.map((m) => (
                      <span key={m} className="text-xs font-bold px-3 py-1.5 rounded-full" style={{ background: "rgba(255,255,255,0.09)", color: "var(--soft-on-dark)" }}>{m}</span>
                    ))}

              </div>
            </div>

            <button
              onClick={onBegin}

              style={{ background: "var(--lamplight)", color: "var(--spruce-deep)" }}

      );
    }

    // ─────────────────────────────────────────────────────────────
    // Parent thank-you — the last thing a caregiver sees. No scores, no
    // interpretation, nothing that could be read as a verdict on them.
    // ─────────────────────────────────────────────────────────────
    function ParentThankYou({ onUnlock, t }) {
      const s = t || UI.en;
      const [celebrate, setCelebrate] = useState(false);
      useEffect(() => {
        const t = setTimeout(() => setCelebrate(true), 180);
        return () => clearTimeout(t);
      }, []);
      return (
        <div className="cib-body min-h-screen w-full flex flex-col relative overflow-hidden" style={{ background: "var(--spruce-deep)", color: "var(--cream-on-dark)" }}>
          <Confetti run={celebrate} />
          <div className="max-w-md mx-auto w-full px-6 py-10 safe-bottom flex flex-col flex-1 items-center justify-center text-center relative" style={{ zIndex: 2 }}>

            <div className="cib-bloom mb-7" aria-hidden="true">
              <svg width="120" height="120" viewBox="0 0 120 120" role="img">
                <circle cx="60" cy="60" r="54" fill="rgba(127,160,140,0.18)" />
                <circle cx="60" cy="60" r="42" fill="var(--moss)" />
                <path d="M42 61 L54 73 L79 48" fill="none" stroke="var(--spruce-deep)" strokeWidth="7" strokeLinecap="round" strokeLinejoin="round" className="cib-check-draw" />
              </svg>
            </div>

            <div className="text-5xl mb-4 cib-bloom" role="img" aria-label="Celebration">🎉</div>

            <h1 className="cib-display text-4xl leading-tight mb-4 cib-rise">{s.thanksTitle}</h1>

            <p className="text-lg leading-relaxed mb-3 cib-rise" style={{ color: "var(--cream-on-dark)" }}>
              {s.thanksLead}
            </p>
            <p className="text-base leading-relaxed cib-rise" style={{ color: "var(--soft-on-dark)" }}>
              {s.thanksBody}
            </p>

            <div className="mt-10 w-full rounded-2xl p-5 cib-rise" style={{ background: "rgba(255,255,255,0.07)", border: "1px solid rgba(255,255,255,0.14)" }}>
              <p className="text-base font-bold mb-1">{s.handBackTitle}</p>
              <p className="text-sm" style={{ color: "var(--soft-on-dark)" }}>
                {s.handBackBody}
              </p>
            </div>

            <button
              onClick={onUnlock}
              className="mt-8 text-xs font-bold uppercase tracking-wider transition-colors hover:text-white"
              style={{ color: "rgba(168,187,175,0.75)", letterSpacing: "0.12em" }}
            >
              {s.providerAccess}
            </button>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────
    // Clinician gate — a 4-digit keypad standing between the thank-you
    // screen and the results. This keeps a caregiver holding the phone out
    // of the scores. It is not a security boundary; see the README.
    // ─────────────────────────────────────────────────────────────
    function ClinicianGate({ onPass, onCancel }) {
      const [entry, setEntry] = useState("");
      const [wrong, setWrong] = useState(false);

      const push = (d) => {
        if (entry.length >= 4) return;
        const next = entry + d;
        setEntry(next);
        setWrong(false);
        if (next.length === 4) {
          setTimeout(() => {
            if (next === CLINICIAN_CODE) onPass();
            else { setWrong(true); setEntry(""); }
          }, 140);
        }
      };

      return (
        <div className="cib-body min-h-screen w-full flex flex-col cib-fade" style={{ background: "var(--spruce-deep)", color: "var(--cream-on-dark)" }}>
          <div className="max-w-xs mx-auto w-full px-5 pt-6 pb-8 safe-bottom flex flex-col flex-1">
            <button onClick={onCancel} className="self-start text-xs font-bold uppercase tracking-wider transition-colors hover:text-white" style={{ color: "var(--soft-on-dark)" }}>
              &larr; Back
            </button>

            <div className="flex-1 flex flex-col justify-center">
              <div className="text-center mb-8">
                <h1 className="cib-display text-2xl mb-2">Provider access</h1>
                <p className="text-sm" style={{ color: "var(--soft-on-dark)" }}>
                  Enter the code to view results.
                </p>
              </div>

              <div className="flex justify-center gap-3 mb-3" role="status" aria-live="polite">
                {[0, 1, 2, 3].map((i) => (
                  <div key={i} className="w-4 h-4 rounded-full transition-all" style={{
                    background: i < entry.length ? "var(--lamplight)" : "rgba(255,255,255,0.16)",
                    transform: i < entry.length ? "scale(1.15)" : "none",
                  }} />
                ))}
              </div>
              <p className="text-center text-sm h-6 mb-4" style={{ color: wrong ? "var(--rose-soft)" : "transparent" }}>
                {wrong ? "That code didn't match. Try again." : "placeholder"}
              </p>

              <div className="grid grid-cols-3 gap-3">
                {["1", "2", "3", "4", "5", "6", "7", "8", "9"].map((d) => (
                  <button key={d} onClick={() => push(d)} aria-label={"Digit " + d}
                    className="rounded-2xl py-5 text-2xl font-bold transition-transform active:scale-95"
                    style={{ background: "rgba(255,255,255,0.07)", color: "var(--cream-on-dark)", border: "1px solid rgba(255,255,255,0.14)" }}>
                    {d}
                  </button>
                ))}
                <div />
                <button onClick={() => push("0")} aria-label="Digit 0"
                  className="rounded-2xl py-5 text-2xl font-bold transition-transform active:scale-95"
                  style={{ background: "rgba(255,255,255,0.07)", color: "var(--cream-on-dark)", border: "1px solid rgba(255,255,255,0.14)" }}>
                  0
                </button>
                <button onClick={() => { setEntry(entry.slice(0, -1)); setWrong(false); }} aria-label="Delete"
                  className="rounded-2xl py-5 text-lg font-bold transition-transform active:scale-95"
                  style={{ background: "transparent", color: "var(--soft-on-dark)" }}>
                  ⌫
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────
    // Recorder — drives every instrument.
    //
    // Flow:  setup (clinician) → intro → fill (parent) → thanks (parent)
    //        → gate → results (clinician)
    //
    // The parent only ever sees intro / fill / thanks. Results sit behind
    // the code, and there is no path from the thank-you screen back into the
    // dashboard without it.
    // ─────────────────────────────────────────────────────────────
    function Recorder({ instrument, onExit }) {
      const [form, setForm] = useState(instrument.build);
      const [mode, setMode] = useState("setup"); // setup | intro | fill | thanks | gate | results
      const [answers, setAnswers] = useState({});
      const [idx, setIdx] = useState(0);
      const [saveState, setSaveState] = useState("idle");
      const [copied, setCopied] = useState(false);
      const [confirmReset, setConfirmReset] = useState(false);
      const [showEditor, setShowEditor] = useState(false);
      const [autoAdvance, setAutoAdvance] = useState(true);
      const [gateReturn, setGateReturn] = useState("results");
      const [meta, setMeta] = useState({ childName: "", childId: "", caregiverName: "", clinician: "", date: "", interval: "", ageMonths: "", sex: "" });
      const [lang, setLang] = useState("en");
      const loadedRef = useRef(false);
      const advanceRef = useRef(null);
      const FORM_KEY = STORAGE_PREFIX + instrument.id + ":form:v1";

      // Load any saved edits to the question bank
      useEffect(() => {
        let alive = true;
        (async () => {
          try {
            if (!window.storage) { if (alive) setSaveState("off"); loadedRef.current = true; return; }
            const result = await window.storage.get(FORM_KEY);
            if (alive && result && result.value) {
              const parsed = JSON.parse(result.value);
              if (parsed && Array.isArray(parsed.questions)) setForm(parsed);
            }
          } catch (e) { /* fall back to the built-in bank */ }
          finally { loadedRef.current = true; }
        })();
        return () => { alive = false; };
      }, [FORM_KEY]);

      // Persist edits to the question bank (never the answers)
      useEffect(() => {
        if (!loadedRef.current) return;
        let cancelled = false;
        const t = setTimeout(async () => {
          try {
            if (!window.storage) return;
            await window.storage.set(FORM_KEY, JSON.stringify(form));
            if (!cancelled) {
              setSaveState("saved");
              setTimeout(() => { if (!cancelled) setSaveState("idle"); }, 1500);
            }
          } catch (e) { if (!cancelled) setSaveState("off"); }
        }, 600);
        return () => { cancelled = true; clearTimeout(t); };
      }, [form, FORM_KEY]);

      useEffect(() => () => { if (advanceRef.current) clearTimeout(advanceRef.current); }, []);

      const askable = form.questions.filter((q) => q.text.trim().length > 0);
      const current = askable[idx];
      // Caregiver-facing copy follows `lang`; clinician screens stay English.
      const t = UI[lang] || UI.en;
      const qText = (q) => (lang === "es" && q.text_es ? q.text_es : q.text);
      const scaleFor = (q) => {
        if (q && q.bank === "worry") return (lang === "es" && form.worryScale_es) ? form.worryScale_es : (form.worryScale || form.scale);
        return (lang === "es" && form.scale_es) ? form.scale_es : form.scale;
      };
      const pick = (en, es) => (lang === "es" && es ? es : en);
      const scored = instrument.score(form, answers, meta);

      // ─── flow ───
      const startSession = () => {
        if (askable.length === 0) return;
        setAnswers({});
        setIdx(0);
        setCopied(false);
        setMode("intro");
      };
      const goNext = () => {
        if (advanceRef.current) clearTimeout(advanceRef.current);
        if (idx + 1 >= askable.length) setMode("thanks");
        else setIdx(idx + 1);
      };
      const goBack = () => {
        if (advanceRef.current) clearTimeout(advanceRef.current);
        if (idx === 0) setMode("intro");
        else setIdx(idx - 1);
      };
      const choose = (value) => {
        setAnswers((a) => ({ ...a, [current.id]: value }));
        if (autoAdvance && current.type !== "text") {
          if (advanceRef.current) clearTimeout(advanceRef.current);
          advanceRef.current = setTimeout(() => {
            setIdx((i) => {
              if (i + 1 >= askable.length) { setMode("thanks"); return i; }
              return i + 1;
            });
          }, 260);
        }
      };

      // ─── editing helpers ───
      const updateQuestion = (id, patch) => setForm((f) => ({ ...f, questions: f.questions.map((q) => (q.id === id ? { ...q, ...patch } : q)) }));
      const removeQuestion = (id) => setForm((f) => ({ ...f, questions: f.questions.filter((q) => q.id !== id) }));
      const moveQuestion = (id, dir) => setForm((f) => {
        const qs = [...f.questions];
        const i = qs.findIndex((q) => q.id === id);
        const j = i + dir;
        if (i < 0 || j < 0 || j >= qs.length) return f;
        [qs[i], qs[j]] = [qs[j], qs[i]];
        return { ...f, questions: qs };
      });
      const restoreDefaults = () => {
        if (!confirmReset) { setConfirmReset(true); setTimeout(() => setConfirmReset(false), 3000); return; }
        setConfirmReset(false);
        setForm(instrument.build());
        setAnswers({});
      };

      // ─── summary ───
      const answerLabel = (q) => {
        const v = answers[q.id];
        if (v === "skip") return "Prefer not to answer";
        if (v === "N") return "N — no contact with other children";
        if (v === undefined || v === null) return "Not answered";
        if (q.type === "yesno") return v === 0 ? "Yes" : "No";
        if (q.type === "choice" && Array.isArray(q.choices)) return q.choices[v] ? q.choices[v].label : "Not answered";
        if (q.type === "text") return typeof v === "string" && v.trim() ? v.trim() : "Not answered";
        const sc = q.bank === "worry" ? (form.worryScale || form.scale) : form.scale;
        return sc[v] !== undefined ? sc[v] : "Not answered";
      };

      const summaryText = () => {
        const lines = [
          form.title + (form.subtitle ? " — " + form.subtitle : ""),
          "Date: " + (meta.date || new Date().toLocaleDateString()),
          "Child: " + (meta.childName || "(not provided)") + (meta.childId ? "  |  ID: " + meta.childId : ""),
          "Caregiver: " + (meta.caregiverName || "(not provided)"),
          "Clinician: " + (meta.clinician || "(not provided)"),
        ];
        if (meta.interval) lines.push("Interval: " + meta.interval);
        if (instrument.needsAgeSex) lines.push("Adjusted age: " + (meta.ageMonths || "?") + " months  |  Sex: " + (meta.sex === "F" ? "Girl" : meta.sex === "M" ? "Boy" : "?"));
        if (instrument.hasSpanish) lines.push("Administered in: " + (lang === "es" ? "Spanish" : "English"));
        lines.push("");
        if (scored.headline) {
          lines.push(scored.headline.label + ": " + scored.headline.value + " of " + scored.headline.max);
          if (scored.headline.verdict) lines.push(scored.headline.verdict.label + " — " + scored.headline.verdict.note);
          lines.push("");
        }
        if (scored.rows.length) {
          lines.push("Breakdown");
          scored.rows.forEach((r) => lines.push("  " + r.label + ": " + r.value + " of " + r.max));
          lines.push("");
        }
        scored.alerts.forEach((a) => { lines.push("** " + a.title + " **"); lines.push("   " + a.body); lines.push(""); });
        if (scored.followUps && scored.followUps.length) {
          lines.push("Suggested follow-up");
          scored.followUps.forEach((f) => { lines.push("  " + f.label); lines.push("    " + f.prompt); });
          lines.push("");
        }
        lines.push("Responses");
        askable.forEach((q, i) => { lines.push("  " + (i + 1) + ". " + q.text); lines.push("     " + answerLabel(q)); });
        if (instrument.copyright) { lines.push(""); lines.push(instrument.copyright); }
        return lines.join("\n");
      };

      const copySummary = async () => {
        const text = summaryText();
        try { await navigator.clipboard.writeText(text); setCopied(true); }
        catch (e) {
          try {
            const ta = document.createElement("textarea");
            ta.value = text; document.body.appendChild(ta); ta.select();
            document.execCommand("copy"); document.body.removeChild(ta); setCopied(true);
          } catch (err) { setCopied(false); }
        }
        setTimeout(() => setCopied(false), 2000);
      };

      const Eyebrow = ({ children, dark }) => (
        <div className="text-xs font-bold uppercase tracking-widest mb-2" style={{ color: dark ? "var(--soft-on-dark)" : "var(--moss)", letterSpacing: "0.14em" }}>
          {children}
        </div>
      );

      // ═══ SETUP (clinician) ═══
      if (mode === "setup") {
        return (
          <div className="cib-body min-h-screen w-full cib-fade" style={{ background: "var(--paper)", color: "var(--ink)" }}>
            <div className="max-w-md mx-auto px-4 pt-6 pb-16 safe-bottom">

              <button onClick={onExit} className="text-xs font-bold uppercase tracking-wider transition-colors hover:text-[#7FA08C] mb-5" style={{ color: "var(--ink-soft)" }}>
                &larr; All assessments
              </button>

              <Eyebrow>{instrument.eyebrow}</Eyebrow>
              <h1 className="cib-display text-3xl leading-tight mb-1" style={{ color: "var(--spruce)" }}>{form.title}</h1>
              <p className="text-sm mb-6" style={{ color: "var(--ink-soft)" }}>{form.subtitle}</p>

              {/* The whole point of this screen: hand it over. Top, big, unmissable. */}
              <button
                onClick={startSession}
                disabled={askable.length === 0}
                className="w-full rounded-3xl px-6 py-7 text-left shadow-lg transition-transform active:scale-[0.99] mb-3"
                style={askable.length === 0
                  ? { background: "var(--mist)", color: "var(--ink-soft)" }
                  : { background: "var(--spruce)", color: "var(--cream-on-dark)" }}
              >
                <div className="flex items-center justify-between gap-4">
                  <div>
                    <div className="cib-display text-2xl leading-tight mb-1">Hand to caregiver</div>
                    <div className="text-sm" style={{ color: "var(--soft-on-dark)" }}>
                      {askable.length} questions · results stay locked
                    </div>
                  </div>
                  <span aria-hidden="true" className="text-3xl flex-shrink-0" style={{ color: "var(--lamplight)" }}>&rarr;</span>
                </div>
              </button>
              <p className="text-xs text-center mb-8" style={{ color: "var(--ink-soft)" }}>
                Opens on a welcome screen. Scores are never shown to the caregiver.
              </p>

              {/* Session details */}
              <div className="rounded-2xl p-4 mb-4" style={{ background: "var(--card)", border: "1px solid var(--mist)" }}>
                <Eyebrow>Session details</Eyebrow>
                <div className="grid grid-cols-2 gap-3 mb-3">
                  <input value={meta.childName} onChange={(e) => setMeta({ ...meta, childName: e.target.value })} placeholder="Child name" className="rounded-lg px-3 py-2 text-sm border border-[#E4E9E2]" style={{ background: "var(--paper)" }} />
                  <input value={meta.childId} onChange={(e) => setMeta({ ...meta, childId: e.target.value })} placeholder="Child ID" className="rounded-lg px-3 py-2 text-sm border border-[#E4E9E2]" style={{ background: "var(--paper)" }} />
                  <input value={meta.caregiverName} onChange={(e) => setMeta({ ...meta, caregiverName: e.target.value })} placeholder="Caregiver name" className="rounded-lg px-3 py-2 text-sm border border-[#E4E9E2]" style={{ background: "var(--paper)" }} />
                  <input value={meta.clinician} onChange={(e) => setMeta({ ...meta, clinician: e.target.value })} placeholder="Clinician" className="rounded-lg px-3 py-2 text-sm border border-[#E4E9E2]" style={{ background: "var(--paper)" }} />
                  <input value={meta.date} onChange={(e) => setMeta({ ...meta, date: e.target.value })} type="date" aria-label="Date of assessment" className="col-span-2 rounded-lg px-3 py-2 text-sm border border-[#E4E9E2]" style={{ background: "var(--paper)" }} />
                  {instrument.needsAgeSex && (
                    <React.Fragment>
                      <input value={meta.ageMonths} onChange={(e) => setMeta({ ...meta, ageMonths: e.target.value.replace(/\D/g, "") })} placeholder="Adjusted age (months)" inputMode="numeric" aria-label="Adjusted age in months" className="rounded-lg px-3 py-2 text-sm border border-[#E4E9E2]" style={{ background: "var(--paper)" }} />
                      <select value={meta.sex} onChange={(e) => setMeta({ ...meta, sex: e.target.value })} aria-label="Sex" className="rounded-lg px-3 py-2 text-sm border border-[#E4E9E2]" style={{ background: "var(--paper)" }}>
                        <option value="">Sex</option>
                        <option value="M">Boy</option>
                        <option value="F">Girl</option>
                      </select>
                    </React.Fragment>
                  )}
                </div>
                {instrument.needsAgeSex && (
                  <p className="text-xs mb-3" style={{ color: "var(--ink-soft)" }}>
                    Age and sex select the cut scores. Adjust for prematurity first if the child was
                    born four or more weeks early.
                  </p>
                )}
                <div className="flex gap-2">
                  {["Baseline", "6-months", "Discharge"].map((iv) => (
                    <button key={iv} onClick={() => setMeta({ ...meta, interval: meta.interval === iv ? "" : iv })}
                      className="flex-1 rounded-lg py-2 text-sm font-bold transition-all"
                      style={meta.interval === iv
                        ? { background: instrument.accent, color: "var(--cream-on-dark)" }
                        : { background: "var(--paper)", color: "var(--ink-soft)", border: "1px solid var(--mist)" }}>
                      {iv}
                    </button>
                  ))}
                </div>
              </div>

              {/* Handoff options */}
              <div className="rounded-2xl p-4 mb-4" style={{ background: "var(--card)", border: "1px solid var(--mist)" }}>
                <Eyebrow>Handoff</Eyebrow>
                {instrument.hasSpanish && (
                  <div className="mb-4">
                    <p className="text-sm mb-2" style={{ color: "var(--ink-soft)" }}>
                      <strong style={{ color: "var(--spruce)" }}>Language</strong> — what the caregiver sees.
                    </p>
                    <div className="flex gap-2">
                      {[["en", "English"], ["es", "Español"]].map(([code, label]) => (
                        <button key={code} onClick={() => setLang(code)}
                          className="flex-1 rounded-lg py-2 text-sm font-bold transition-all"
                          style={lang === code
                            ? { background: instrument.accent, color: "var(--cream-on-dark)" }
                            : { background: "var(--paper)", color: "var(--ink-soft)", border: "1px solid var(--mist)" }}>
                          {label}
                        </button>
                      ))}
                    </div>
                  </div>
                )}
                <label className="flex items-start gap-3 cursor-pointer">
                  <input type="checkbox" checked={autoAdvance} onChange={(e) => setAutoAdvance(e.target.checked)} className="mt-1 w-5 h-5 flex-shrink-0" />
                  <span className="text-sm" style={{ color: "var(--ink-soft)" }}>
                    <strong style={{ color: "var(--spruce)" }}>Advance automatically</strong> — moving to the next
                    question as soon as an answer is tapped, so a caregiver taps once per question instead of twice.
                  </span>
                </label>
              </div>

              {/* About */}
              <div className="rounded-2xl p-4 mb-4" style={{ background: "var(--card)", border: "1px solid var(--mist)" }}>
                <Eyebrow>About this instrument</Eyebrow>
                <p className="text-xs mb-2" style={{ color: "var(--ink-soft)" }}>{instrument.blurb}</p>
                {instrument.copyright && <p className="text-xs" style={{ color: "var(--ink-soft)" }}>{instrument.copyright}</p>}
                <p className="text-xs mt-2" style={{ color: "var(--ink-soft)" }}>
                  This tool records responses and totals them. Interpretation and clinical
                  decisions remain yours, using the official manual.
                </p>
              </div>

              {/* Question bank, collapsed — a caregiver must never land in an editor */}
              <button onClick={() => setShowEditor(!showEditor)}
                className="w-full rounded-2xl p-4 text-left flex items-center justify-between transition-colors hover:bg-[#FAF8F5]"
                style={{ background: "var(--card)", border: "1px solid var(--mist)" }}>
                <span className="text-sm font-bold" style={{ color: "var(--spruce)" }}>
                  Edit questions
                  <span className="font-normal" style={{ color: "var(--ink-soft)" }}> · {askable.length} loaded</span>
                  {saveState === "saved" && <span style={{ color: "var(--moss)" }}> · Saved</span>}
                </span>
                <span aria-hidden="true" style={{ color: "var(--ink-soft)" }}>{showEditor ? "▲" : "▼"}</span>
              </button>

              {showEditor && (
                <div className="mt-4">
                  <p className="text-xs mb-4" style={{ color: "var(--ink-soft)" }}>
                    Edits are saved on this device only.
                    {instrument.copyright && " This instrument's terms require items and item order to stay unmodified."}
                  </p>
                  {form.questions.map((q, i) => (
                    <div key={q.id} className="rounded-2xl p-4 mb-3" style={{ background: "var(--card)", border: "1px solid var(--mist)" }}>
                      <div className="flex items-start justify-between mb-2">
                        <span className="cib-display text-lg" style={{ color: "var(--moss)" }}>{i + 1}</span>
                        <div className="flex gap-1">
                          <button onClick={() => moveQuestion(q.id, -1)} aria-label="Move up" className="w-8 h-8 rounded-lg text-sm" style={{ background: "var(--paper)", color: "var(--spruce)" }}>↑</button>
                          <button onClick={() => moveQuestion(q.id, 1)} aria-label="Move down" className="w-8 h-8 rounded-lg text-sm" style={{ background: "var(--paper)", color: "var(--spruce)" }}>↓</button>
                          <button onClick={() => removeQuestion(q.id)} aria-label="Delete" className="w-8 h-8 rounded-lg text-sm" style={{ background: "var(--paper)", color: "var(--ink-soft)" }}>✕</button>
                        </div>
                      </div>
                      <textarea value={q.text} onChange={(e) => updateQuestion(q.id, { text: e.target.value })} rows={2}
                        aria-label={"Question " + (i + 1)}
                        className="w-full rounded-lg px-3 py-2 text-base border mb-2 resize-none border-[#E4E9E2]"
                        style={{ background: "var(--paper)", color: "var(--ink)" }} />
                      <input value={q.category || ""} onChange={(e) => updateQuestion(q.id, { category: e.target.value })} placeholder="Section"
                        aria-label={"Question " + (i + 1) + " section"}
                        className="w-full rounded-lg px-3 py-2 text-sm border border-[#E4E9E2]" style={{ background: "var(--paper)" }} />
                    </div>
                  ))}
                  <button onClick={restoreDefaults} className="w-full py-3 text-sm" style={{ color: confirmReset ? "var(--alert)" : "var(--ink-soft)" }}>
                    {confirmReset ? "Tap again to restore the original items" : "Restore original items"}
                  </button>
                </div>
              )}
            </div>
          </div>
        );
      }

      // ═══ INTRO (title card) ═══
      if (mode === "intro") {
        return (
          <AssessmentIntro
            eyebrow={instrument.eyebrow}
            title={pick(form.title, form.title_es)}
            subtitle={pick(form.subtitle, form.subtitle_es)}
            purpose={pick(instrument.purpose, instrument.purpose_es)}
            note={pick(instrument.parentNote, instrument.parentNote_es)}
            meta={pick(instrument.meta, instrument.meta_es)}
            accent={instrument.accentVar}
            beginLabel={t.start}
            backLabel={t.back}
            onBegin={() => setMode("fill")}
            onBack={() => setMode("setup")}
          />
        );
      }

      // ═══ FILL (parent) ═══
      if (mode === "fill" && current) {
        const progress = ((idx + 1) / askable.length) * 100;
        const value = answers[current.id];
        const half = Math.floor(askable.length / 2);
        const encouragement =
          idx + 1 === half && askable.length >= 12 ? t.halfway :
          idx + 1 === askable.length ? t.lastOne : null;
        const activeScale = scaleFor(current);

        const optionButton = (label, selected, onClick, key, hint) => (
          <button key={key} onClick={onClick}
            className="w-full rounded-2xl py-5 px-5 text-left text-lg font-bold transition-all active:scale-[0.99]"
            style={selected
              ? { background: "var(--lamplight)", color: "var(--spruce-deep)", boxShadow: "0 0 0 3px rgba(242,182,83,0.35)" }
              : { background: "rgba(255,255,255,0.07)", color: "var(--cream-on-dark)", border: "1px solid rgba(255,255,255,0.14)" }}>
            {label}
            {hint ? <span className="block text-sm font-normal mt-0.5" style={{ opacity: 0.7 }}>{hint}</span> : null}
          </button>
        );

        return (
          <div className="cib-body min-h-screen w-full flex flex-col" style={{ background: "var(--spruce-deep)", color: "var(--cream-on-dark)" }}>
            <div className="max-w-md mx-auto w-full px-5 pt-6 pb-8 safe-bottom flex flex-col flex-1">

              <div className="mb-7">
                <div className="flex justify-between items-baseline mb-2">
                  <span className="text-sm font-bold" style={{ color: "var(--soft-on-dark)" }}>
                    {t.question(idx + 1, askable.length)}
                  </span>
                  {encouragement && <span className="text-sm" style={{ color: "var(--lamplight)" }}>{encouragement}</span>}
                </div>
                <div className="h-1.5 rounded-full w-full" style={{ background: "rgba(255,255,255,0.12)" }}>
                  <div className="h-1.5 rounded-full" style={{ width: progress + "%", background: "var(--lamplight)", transition: "width 300ms ease" }} />
                </div>
              </div>

              <div key={current.id} className="cib-fade flex-1 flex flex-col">
                {current.category ? (
                  <div className="text-xs font-bold uppercase tracking-widest mb-3" style={{ color: "var(--soft-on-dark)", letterSpacing: "0.14em" }}>
                    {current.category}
                  </div>
                ) : null}

                <h1 className="cib-display text-2xl leading-snug mb-3" style={{ color: "var(--cream-on-dark)" }}>
                  {qText(current)}
                </h1>
                {current.example ? (
                  <p className="text-base leading-relaxed mb-6" style={{ color: "var(--soft-on-dark)" }}>{current.example}</p>
                ) : <div className="mb-6" />}

                {current.type === "yesno" ? (
                  <div className="flex flex-col gap-3">
                    {optionButton("Yes", value === 0, () => choose(0), "y")}
                    {optionButton("No", value === 1, () => choose(1), "n")}
                  </div>
                ) : current.type === "choice" && Array.isArray(current.choices) ? (
                  <div className="flex flex-col gap-3">
                    {current.choices.map((c, i) => optionButton(c.label, value === i, () => choose(i), i))}
                  </div>
                ) : current.type === "text" ? (
                  <textarea value={typeof value === "string" ? value : ""} onChange={(e) => setAnswers({ ...answers, [current.id]: e.target.value })}
                    placeholder="Whatever comes to mind is fine here." rows={5} aria-label="Your answer"
                    className="w-full rounded-2xl p-4 text-base resize-none focus:outline-none"
                    style={{ background: "rgba(255,255,255,0.07)", color: "var(--cream-on-dark)", border: "1px solid rgba(255,255,255,0.14)" }} />
                ) : (
                  <div className="flex flex-col gap-3">
                    {activeScale.map((label, i) => optionButton(label, value === i, () => choose(i), i))}
                    {current.noContact && optionButton(t.noContact, value === "N", () => choose("N"), "N")}
                  </div>
                )}

                {form.allowSkip && current.type !== "text" && (
                  <button onClick={() => choose("skip")}
                    className="mt-4 self-center text-sm underline transition-colors hover:text-white"
                    style={{ color: value === "skip" ? "var(--lamplight)" : "var(--soft-on-dark)" }}>
                    {value === "skip" ? t.skipped : t.skip}
                  </button>
                )}
              </div>

              <div className="flex gap-3 mt-8">
                <button onClick={goBack} className="rounded-2xl py-4 px-6 text-base font-bold transition-colors hover:bg-white/10"
                  style={{ background: "rgba(255,255,255,0.07)", color: "var(--cream-on-dark)", border: "1px solid rgba(255,255,255,0.14)" }}>
                  {t.back}
                </button>
                <button onClick={goNext} className="flex-1 rounded-2xl py-4 text-base font-bold transition-colors hover:bg-opacity-90"
                  style={{ background: "var(--cream-on-dark)", color: "var(--spruce-deep)" }}>
                  {idx + 1 >= askable.length ? t.finish : t.next}
                </button>
              </div>
            </div>
          </div>
        );
      }

      // ═══ THANKS (parent) ═══
      if (mode === "thanks") {
        return <ParentThankYou t={t} onUnlock={() => { setGateReturn("results"); setMode("gate"); }} />;
      }

      // ═══ GATE ═══
      if (mode === "gate") {
        return (
          <ClinicianGate
            onPass={() => setMode(gateReturn)}
            onCancel={() => setMode("thanks")}
          />
        );
      }

      // ═══ RESULTS (clinician) ═══
      const answeredCount = askable.filter((q) => answers[q.id] !== undefined).length;
      const skippedCount = askable.filter((q) => answers[q.id] === "skip").length;
      const hv = scored.headline && scored.headline.verdict;

      return (
        <div className="cib-body min-h-screen w-full cib-fade" style={{ background: "var(--paper)", color: "var(--ink)" }}>
          <div className="max-w-md mx-auto px-4 py-8 safe-bottom">

            <Eyebrow>Provider snapshot</Eyebrow>
            <h1 className="cib-display text-3xl mb-1" style={{ color: "var(--spruce)" }}>{form.title}</h1>
            <p className="text-sm mb-6" style={{ color: "var(--ink-soft)" }}>
              {answeredCount} of {askable.length} answered
              {skippedCount > 0 && " · " + skippedCount + " skipped"}
              {meta.childName ? " · " + meta.childName : ""}
              {" · "}{meta.date || new Date().toLocaleDateString()}
            </p>

            {/* Headline */}
            {scored.headline && (
              <div className="rounded-2xl p-5 mb-4" style={{ background: "var(--spruce)", color: "var(--cream-on-dark)" }}>
                <Eyebrow dark>{scored.headline.label}</Eyebrow>
                <div className="flex justify-between items-baseline mb-3 gap-3">
                  <span className="cib-display text-5xl">
                    {scored.headline.value}
                    <span className="text-base" style={{ color: "var(--soft-on-dark)" }}> / {scored.headline.max}</span>
                  </span>
                  {hv && (
                    <span className="text-xs font-bold px-3 py-2 rounded-full text-right" style={{ background: TONE_COLOR[hv.tone], color: "var(--cream-on-dark)" }}>
                      {hv.label}
                    </span>
                  )}
                </div>
                {hv && <p className="text-xs leading-relaxed" style={{ color: "var(--soft-on-dark)" }}>{hv.note}</p>}
              </div>
            )}

            {/* Alerts */}
            {scored.alerts.map((a, i) => (
              <div key={i} className="rounded-2xl p-4 mb-3" style={{
                background: a.tone === "alert" ? "var(--rose)" : a.tone === "watch" ? "#FBF1DC" : "var(--card)",
                color: a.tone === "alert" ? "var(--cream-on-dark)" : "var(--ink)",
                border: a.tone === "alert" ? "none" : "1px solid var(--mist)",
              }}>
                <p className="text-sm font-bold mb-1">{a.title}</p>
                <p className="text-xs leading-relaxed" style={{ color: a.tone === "alert" ? "var(--rose-soft)" : "var(--ink-soft)" }}>{a.body}</p>
              </div>
            ))}

            {/* Breakdown */}
            {scored.rows.length > 0 && (
              <div className="rounded-2xl p-4 mb-4" style={{ background: "var(--card)", border: "1px solid var(--mist)" }}>
                <Eyebrow>Breakdown</Eyebrow>
                {scored.rows.map((r, i) => (
                  <div key={i} className="flex justify-between items-baseline gap-3 py-1.5" style={{ opacity: r.muted ? 0.45 : 1 }}>
                    <span className={"text-sm " + (r.emphasis ? "font-bold" : "")} style={{ color: r.tone === "alert" ? "var(--rose)" : r.emphasis ? "var(--spruce)" : "var(--ink-soft)" }}>
                      {r.label}
                    </span>
                    <span className={"cib-display flex-shrink-0 " + (r.emphasis ? "text-xl" : "text-lg")} style={{ color: r.tone === "alert" ? "var(--rose)" : "var(--spruce)" }}>
                      {r.value}<span className="text-xs" style={{ color: "var(--ink-soft)" }}> / {r.max}</span>
                    </span>
                  </div>
                ))}
              </div>
            )}

            {/* Follow-up prompts */}
            {scored.followUps && scored.followUps.length > 0 && (
              <div className="rounded-2xl p-4 mb-4" style={{ background: "var(--card)", border: "1px solid var(--mist)" }}>
                <Eyebrow>Suggested follow-up</Eyebrow>
                <p className="text-xs mb-3" style={{ color: "var(--ink-soft)" }}>
                  Conversation openers for the sections that scored. These are a menu, not a script — never read aloud.
                </p>
                {scored.followUps.map((f, i) => (
                  <div key={i} className="py-2" style={i < scored.followUps.length - 1 ? { borderBottom: "1px solid var(--mist)" } : {}}>
                    <p className="text-sm font-bold mb-1" style={{ color: "var(--spruce)" }}>{f.label}</p>
                    <p className="text-xs leading-relaxed" style={{ color: "var(--ink-soft)" }}>{f.prompt}</p>
                  </div>
                ))}
              </div>
            )}

            {/* Item-by-item */}
            <details className="rounded-2xl mb-6" style={{ background: "var(--card)", border: "1px solid var(--mist)" }}>
              <summary className="p-4 text-sm font-bold cursor-pointer" style={{ color: "var(--spruce)" }}>
                Every response ({askable.length})
              </summary>
              <div className="px-4 pb-4">
                {askable.map((q, i) => {
                  const s = scored.itemScore ? scored.itemScore(q) : null;
                  return (
                    <div key={q.id} className="py-2.5" style={i < askable.length - 1 ? { borderBottom: "1px solid var(--mist)" } : {}}>
                      <div className="flex justify-between items-start gap-2">
                        <div className="text-xs" style={{ color: "var(--ink-soft)" }}>{i + 1}. {q.text}</div>
                        {s !== null && s !== undefined && <div className="text-xs font-bold flex-shrink-0" style={{ color: "var(--moss)" }}>{s}</div>}
                      </div>
                      <div className="text-sm font-bold mt-0.5" style={{ color: answers[q.id] === "skip" ? "var(--ink-soft)" : "var(--spruce)" }}>
                        {answerLabel(q)}
                      </div>
                    </div>
                  );
                })}
              </div>
            </details>

            <button onClick={copySummary} className="w-full rounded-2xl py-4 text-lg font-bold mb-3 transition-colors hover:bg-opacity-90" style={{ background: "var(--spruce)", color: "var(--cream-on-dark)" }}>
              {copied ? "Copied" : "Copy for the record"}
            </button>
            <div className="flex gap-3">
              <button onClick={startSession} className="flex-1 rounded-2xl py-3 text-base font-bold transition-colors hover:bg-[#FAF8F5]" style={{ background: "var(--card)", color: "var(--spruce)", border: "1px solid var(--mist)" }}>
                New session
              </button>
              <button onClick={() => setMode("setup")} className="flex-1 rounded-2xl py-3 text-base font-bold transition-colors hover:bg-[#FAF8F5]" style={{ background: "var(--card)", color: "var(--spruce)", border: "1px solid var(--mist)" }}>
                Setup
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────
    // Dashboard / router
    // ─────────────────────────────────────────────────────────────
    function App() {
      const [active, setActive] = useState(null);

      useEffect(() => {
        const handleHash = () => {
          const id = window.location.hash.replace("#", "");
          setActive(instrumentById(id) ? id : null);
        };
        handleHash();
        window.addEventListener("hashchange", handleHash);
        return () => window.removeEventListener("hashchange", handleHash);
      }, []);

      const open = (id) => { window.location.hash = id; };
      const close = () => { window.location.hash = ""; };

      const instrument = instrumentById(active);
      if (instrument) return <Recorder key={instrument.id} instrument={instrument} onExit={close} />;

      return (
        <div className="cib-body min-h-screen w-full" style={{ background: "var(--paper)", color: "var(--ink)" }}>
          <div className="max-w-md mx-auto w-full px-5 py-12 safe-bottom">

            <div className="text-center mb-10">
              <h1 className="cib-display text-3xl font-bold tracking-tight mb-2" style={{ color: "var(--spruce)" }}>
                Assessment Recorders
              </h1>
              <p className="text-sm" style={{ color: "var(--ink-soft)" }}>
                Phone-first instruments built to hand to a caregiver.
              </p>
            </div>

            <div className="flex flex-col gap-4 mb-8">
              {INSTRUMENTS.map((ins) => (
                <button key={ins.id} onClick={() => open(ins.id)}
                  className="w-full text-left bg-white p-6 rounded-2xl border border-[#E4E9E2] hover:shadow-md transition-all active:scale-[0.99] group"
                  style={{ borderLeft: "5px solid " + ins.accent }}>
                  <div className="flex justify-between items-start mb-3 gap-3">
                    <span className="text-xs font-bold uppercase tracking-wider" style={{ color: ins.accent }}>{ins.eyebrow}</span>
                    <span className="text-xs font-medium px-2.5 py-1 rounded-full flex-shrink-0" style={{ color: "var(--ink-soft)", background: "var(--mist)" }}>{ins.tag}</span>
                  </div>
                  <h2 className="cib-display text-xl font-bold mb-2" style={{ color: "var(--spruce)" }}>{ins.card}</h2>
                  <p className="text-sm" style={{ color: "var(--ink-soft)" }}>{ins.blurb}</p>
                </button>
              ))}

              {/* Clinician-completed, so it lives on its own page */}
              <a href="cca-assessment.html"
                className="block w-full text-left bg-white p-6 rounded-2xl border border-[#E4E9E2] hover:shadow-md transition-all active:scale-[0.99] no-underline"
                style={{ borderLeft: "5px solid var(--lamplight-deep)" }}>
                <div className="flex justify-between items-start mb-3 gap-3">
                  <span className="text-xs font-bold uppercase tracking-wider" style={{ color: "var(--lamplight-deep)" }}>Clinician-completed</span>
                  <span className="text-xs font-medium px-2.5 py-1 rounded-full flex-shrink-0" style={{ color: "var(--ink-soft)", background: "var(--mist)" }}>11 sections</span>
                </div>
                <h2 className="cib-display text-xl font-bold mb-2" style={{ color: "var(--spruce)" }}>CCA &amp; Comprehensive CF Assessment</h2>
                <p className="text-sm" style={{ color: "var(--ink-soft)" }}>
                  The full clinical assessment — risk and protective factors, mental status, developmental and health history, formulation, and treatment recommendations.
                </p>
              </a>
            </div>

            <div className="text-center text-xs pt-6" style={{ color: "var(--ink-soft)", borderTop: "1px solid var(--mist)" }}>
              <p className="mb-2">
                These tools record and total responses. Scoring interpretation and clinical
                decisions must be made by a qualified professional using the official manual
                for each instrument.
              </p>
              <p>Caregiver-facing screens never display scores.</p>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
